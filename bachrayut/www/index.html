<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>באחריות</title>
<meta name="description" content="מצלמים חשבונית, והאפליקציה שומרת את המוצר, את החנות, את נותן האחריות ואת תאריך הסיום. הכל ממוין לפי קטגוריה.">
<meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&family=Rubik:wght@400;500;600;700;800&family=Varela+Round&family=Secular+One&family=Suez+One&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EFE6; --bg-2:#EAE4D7; --surface:#FFFDF8; --surface-2:#F8F4EC;
  --ink:#14201B; --ink-2:#34413B; --muted:#6A756F; --line:#E2DBCC; --line-2:#D3CAB7;
  --accent:#0F6B4F; --accent-2:#13855F; --accent-soft:#DCEDE4; --accent-ink:#FFFFFF;
  --gold:#B7791F; --gold-soft:#F6E7C8;
  --warn:#B45309; --warn-soft:#FBE7CF;
  --danger:#B4372A; --danger-soft:#F7DCD6;
  --shadow:0 1px 2px rgba(20,32,27,.05),0 8px 24px -12px rgba(20,32,27,.18);
  --shadow-lg:0 2px 6px rgba(20,32,27,.06),0 24px 48px -20px rgba(20,32,27,.32);
  --r-sm:12px; --r:18px; --r-lg:26px;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --display:'Frank Ruhl Libre','Heebo',serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --bg-2:#141C19; --surface:#18211D; --surface-2:#1E2924;
  --ink:#EEF2EC; --ink-2:#CBD4CD; --muted:#93A09A; --line:#26332D; --line-2:#33423B;
  --accent:#3FB68A; --accent-2:#5CCB9F; --accent-soft:#16342A; --accent-ink:#06140F;
  --gold:#E0A84A; --gold-soft:#3A2D15; --warn:#F0A04B; --warn-soft:#3A2814; --danger:#F08070; --danger-soft:#3D1F1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 30px 60px -24px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0F1513; --bg-2:#141C19; --surface:#18211D; --surface-2:#1E2924;
  --ink:#EEF2EC; --ink-2:#CBD4CD; --muted:#93A09A; --line:#26332D; --line-2:#33423B;
  --accent:#3FB68A; --accent-2:#5CCB9F; --accent-soft:#16342A; --accent-ink:#06140F;
  --gold:#E0A84A; --gold-soft:#3A2D15; --warn:#F0A04B; --warn-soft:#3A2814; --danger:#F08070; --danger-soft:#3D1F1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 30px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
body{min-height:100vh;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 112px);position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.brand-name{font-family:var(--display);font-weight:var(--dw);font-size:26px;letter-spacing:-.01em;line-height:1}
.brand-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);transition:transform .15s,background .2s}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.94)}

/* ---------- hero summary ---------- */
.summary{position:relative;border-radius:var(--r-lg);padding:22px 20px 20px;background:var(--hero-bg);color:var(--hero-ink);overflow:hidden;box-shadow:var(--shadow-lg);isolation:isolate}
.summary::before{content:"";position:absolute;inset:auto -60px -90px auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.22),rgba(255,255,255,0) 65%);z-index:-1}
.summary::after{content:"";position:absolute;inset:-40px auto auto -50px;width:180px;height:180px;border-radius:50%;border:1.5px solid rgba(255,255,255,.16);z-index:-1}
.summary-label{font-size:13.5px;opacity:.85;font-weight:500}
.summary-value{color:var(--hero-num);font-family:var(--display);font-weight:var(--dw);font-size:44px;line-height:1.05;margin:4px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:var(--stat-bg);border-radius:14px;padding:10px 12px;backdrop-filter:blur(4px)}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.85;white-space:nowrap}
.m-enter{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
body.booted .m-enter{animation:none}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- search & chips ---------- */
.search{margin:18px 0 12px;position:relative}
.search input{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 48px 0 16px;font-size:16px;box-shadow:var(--shadow);outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 14px;border-radius:var(--chip-r);border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip .n{font-size:12px;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip .dot{width:8px;height:8px;border-radius:50%}

/* ---------- sections ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.sec-head .meta{font-size:13px;color:var(--muted)}
.list{display:grid;gap:10px}

/* ---------- item card ---------- */
.card{background:var(--surface);border:var(--card-bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px;text-align:right;width:100%;transition:transform .18s,box-shadow .18s}
.item:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.item:active{transform:translateY(0) scale(.99)}
.cat-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.item-title{font-weight:700;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.item-sub{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.item-tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.tag.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.soon{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.exp{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.05;font-weight:700;color:var(--ink-2)}
.ring .rv b{display:block;font-size:14px;font-weight:800;color:var(--ink)}

/* ---------- empty ---------- */
.empty{padding:34px 22px 26px;text-align:center}
.empty-art{width:132px;height:132px;margin:0 auto 14px;position:relative}
.empty h3{font-family:var(--display);font-size:26px;margin:0 0 6px;font-weight:var(--dw)}
.empty p{margin:0 auto 18px;color:var(--muted);max-width:330px}
.steps{display:grid;gap:10px;text-align:right;margin:20px 0 4px}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.step i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-style:normal;font-weight:800;display:grid;place-items:center;font-size:14px}
.step b{display:block;font-size:15px}
.step span{font-size:13.5px;color:var(--muted)}

/* ---------- buttons ---------- */
.btn{text-decoration:none;height:52px;padding:0 20px;border-radius:var(--btn-r);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px -10px var(--accent)}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-wa{background:#1FAF55;color:#fff}
.btn-wa:hover{background:#1a9c4b}
.btn-block{width:100%}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-sm{height:44px;font-size:14.5px;border-radius:13px;padding:0 14px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;inset:auto 0 0 0;z-index:30;padding:0 12px calc(var(--safe-b) + 10px);pointer-events:none}
.nav-in{pointer-events:auto;max-width:536px;margin:0 auto;height:72px;border-radius:24px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);box-shadow:var(--shadow-lg);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
.nav a,.nav button.tab{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;border-radius:16px;transition:color .2s}
.nav [aria-current="page"]{color:var(--accent)}
.fab{width:64px;height:64px;margin:-30px auto 0;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 14px 28px -10px var(--accent),0 0 0 6px var(--bg);transition:transform .18s,background .2s}
.fab:hover{background:var(--accent-2);transform:translateY(-2px)}
.fab:active{transform:scale(.95)}

/* ---------- sheets / pages ---------- */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;animation:slide .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.page-in{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 40px)}
.page-bar{display:flex;align-items:center;gap:10px;padding:4px 0 14px;position:sticky;top:0;background:var(--bg);z-index:2}
.page-bar h1{font-size:19px;margin:0;font-weight:800;flex:1}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,16,13,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(var(--safe-b) + 20px);max-height:92vh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grip{width:42px;height:5px;border-radius:5px;background:var(--line-2);margin:4px auto 14px}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:800}
.sheet p.lead{margin:0 0 16px;color:var(--muted);font-size:14.5px}

/* ---------- form ---------- */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin:0 2px 6px}
.field input,.field select,.field textarea{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input.auto{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)) left bottom/100% 0 no-repeat,var(--surface)}
.field .hint{font-size:12.5px;color:var(--muted);margin:5px 2px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-card{padding:16px 14px 6px;margin-bottom:12px}
.form-card h4{margin:0 2px 12px;font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.auto-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.cat-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat-pick button{border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;background:var(--surface);line-height:1.2;min-height:76px;transition:border-color .2s,background .2s,transform .15s}
.cat-pick button:active{transform:scale(.96)}
.cat-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.seg button{height:38px;padding:0 13px;border-radius:11px;border:1px solid var(--line);font-size:14px;font-weight:600;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- capture ---------- */
.capture-zone{border-radius:var(--r-lg);border:1.5px dashed var(--line-2);background:var(--surface);padding:28px 18px;text-align:center}
.cap-preview{position:relative;border-radius:var(--r);overflow:hidden;background:#111;margin-bottom:12px;aspect-ratio:3/4;max-height:52vh;width:100%}
.cap-preview img{width:100%;height:100%;object-fit:contain;display:block}
.scan-line{position:absolute;inset-inline:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent-2),transparent);box-shadow:0 0 18px 4px var(--accent-2);animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%{top:6%}50%{top:92%}100%{top:6%}}
.progress{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.ocr-status{font-size:14px;color:var(--muted);text-align:center}

/* ---------- detail ---------- */
.d-hero{padding:18px;position:relative;overflow:hidden}
.d-top{display:flex;gap:14px;align-items:center}
.d-title{font-family:var(--display);font-weight:var(--dw);font-size:26px;line-height:1.15;margin:0}
.d-cat{font-size:13.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.timeline{margin-top:18px}
.tl-bar{height:10px;border-radius:10px;background:var(--line);position:relative;overflow:hidden}
.tl-bar i{position:absolute;inset-block:0;right:0;border-radius:10px;background:var(--accent)}
.tl-labels{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px}
.tl-labels b{display:block;color:var(--ink);font-size:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0}
.kv div{padding:13px 16px;border-top:1px solid var(--line)}
.kv div:nth-child(odd){border-left:1px solid var(--line)}
.kv span{display:block;font-size:12.5px;color:var(--muted)}
.kv b{font-size:15.5px;font-weight:700;word-break:break-word}
.invoice-thumb{display:block;width:100%;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/10;background:var(--surface-2);border:1px solid var(--line)}
.invoice-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .35s}
.invoice-thumb:hover img{transform:scale(1.03)}
.invoice-thumb .lbl{position:absolute;inset:auto 10px 10px auto;background:rgba(10,16,13,.72);color:#fff;font-size:13px;font-weight:700;padding:6px 11px;border-radius:10px;display:flex;gap:6px;align-items:center}
.contact{padding:16px;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.contact-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.contact-head .av{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px}
.contact-head b{display:block;font-size:16.5px}
.contact-head span{font-size:13px;color:var(--muted)}
.contact-actions{display:grid;gap:8px}
.msg-box{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;white-space:pre-wrap;line-height:1.55;color:var(--ink-2);margin:12px 0 10px;max-height:190px;overflow:auto}
.sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent)}
.sync-pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- categories grid ---------- */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-tile{padding:16px 14px;text-align:right;display:flex;flex-direction:column;gap:12px;transition:transform .18s,box-shadow .18s;min-height:138px}
.cat-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.cat-tile b{font-size:15.5px;display:block}
.cat-tile span{font-size:12.5px;color:var(--muted)}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:80;background:#050807;display:flex;flex-direction:column}
.viewer-bar{display:flex;gap:8px;align-items:center;padding:calc(var(--safe-t) + 10px) 12px 10px;color:#fff}
.viewer-bar .icon-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.12);color:#fff}
.viewer-img{flex:1;overflow:auto;display:grid;place-items:center;touch-action:pinch-zoom}
.viewer-img img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 12px calc(var(--safe-b) + 14px)}

/* ---------- members ---------- */
.member{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.member .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.member b{display:block;font-size:15px}
.member span{font-size:12.5px;color:var(--muted)}
.role{white-space:nowrap;flex:none;margin-inline-start:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}

.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin{border:1.5px solid var(--line);border-radius:18px;padding:8px;background:var(--surface);text-align:right;transition:transform .18s,border-color .2s,box-shadow .2s;position:relative}

.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.skin .pv{border-radius:12px;padding:9px;height:118px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.skin .pv-hero{border-radius:9px;padding:8px 9px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.skin .pv-hero small{font-size:9px;opacity:.85;line-height:1}

.skin .pv-row{display:flex;gap:6px;align-items:center;border-radius:8px;padding:6px 7px;height:30px}
.skin .pv-row i{width:16px;height:16px;border-radius:5px;flex:none}
.skin .pv-row span{height:5px;border-radius:3px;flex:1;opacity:.55}
.skin .pv-row em{width:16px;height:16px;border-radius:50%;flex:none;border:3px solid}
.skin .nm{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 4px 2px}
.skin .nm b{font-size:14.5px;flex:none}
.skin .nm span{font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skin .ok{position:absolute;top:14px;left:14px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center}
.skin[aria-pressed="true"] .ok{display:grid}

function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function compress(dataUrl,max=1700,q=.84){const im=await loadImg(dataUrl);const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function ocrPrep(dataUrl){const im=await loadImg(dataUrl);const s=Math.min(1,2200/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];g=(g-128)*1.45+138;g=g<0?0:g>255?255:g;p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);return c}

/* ---------- OCR ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
let ocrWorker=null;
async function runOCR(dataUrl,onProgress){
  // The app ships the engine and the Hebrew/English data in vendor/ocr (works offline); the web version falls back to the CDN.
  let local=true;
  if(!window.Tesseract){ try{ await loadScript('vendor/ocr/tesseract.min.js') }catch(e){ local=false; await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js') } }
  if(!ocrWorker){
    onProgress(.04,'טוען את מנוע הזיהוי בעברית…');
    const base=new URL('vendor/ocr/',location.href).href;
    const paths=local?{workerPath:base+'worker.min.js',corePath:base+'core',langPath:base+'lang',workerBlobURL:false}:{};
    ocrWorker = await Tesseract.createWorker(['heb','eng'],1,{...paths,logger:m=>{if(m.status==='recognizing text')onProgress(.15+.85*m.progress,'קורא את החשבונית…');else if(/load/.test(m.status))onProgress(.05+.1*(m.progress||0),'טוען את מנוע הזיהוי בעברית…')}});
  }
  const canvas = await ocrPrep(dataUrl);
  const {data} = await ocrWorker.recognize(canvas);
  return data.text||'';
}

/* ---------- invoice parser ---------- */
function parseInvoice(raw){
  const text = raw.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').replace(/[|_]+/g,' ').replace(/[ \t]+/g,' ');
  const lines = text.split(/\n/).map(s=>s.trim()).filter(s=>s.length>1);
  const low = ' '+text.toLowerCase()+' ';
  const out = {};

  // date — the most recent plausible date that is not in the future
  const now = new Date(); let best=null;
  for(const m of text.matchAll(/(\d{1,2})\s?[\/.\-]\s?(\d{1,2})\s?[\/.\-]\s?(\d{2,4})/g)){
    let [_,d,mo,y]=m; d=+d; mo=+mo; y=+y; if(y<100)y+=2000;
    if(mo<1||mo>12||d<1||d>31||y<2005)continue;
    const dt=new Date(y,mo-1,d); if(dt>new Date(now.getTime()+864e5))continue;
    if(!best||dt>best)best=dt;
  }
  if(best) out.purchaseDate = new Date(best.getTime()-best.getTimezoneOffset()*6e4).toISOString().slice(0,10);

  // amount — prefer totals
  const num = s=>parseFloat(s.replace(/,/g,''));
  const numRe = /(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{1,2}|\d{2,6})/g;
  let amt=0;
  for(const l of lines){ if(/(סה["״']?כ|סך הכל|סך הכול|לתשלום|total|סכום|לחיוב|שולם)/i.test(l)){ for(const m of l.matchAll(numRe)){const v=num(m[1]);if(v>amt&&v<500000&&!/^(19|20)\d\d$/.test(m[1]))amt=v} } }
  if(!amt){ for(const m of text.matchAll(/(\d{1,3}(?:,\d{3})*\.\d{2})/g)){const v=num(m[1]);if(v>amt&&v<500000)amt=v} }
  if(amt) out.amount = amt;

  // phones — only from lines about service/warranty (a store's own number is not the warranty provider's)
  const svc=lines.filter(l=>/(שירות|אחריות|מעבד|מוקד|service|support)/i.test(l)).join('\n');
  const phones=[...svc.matchAll(/(\*\d{4}|1[\-\s]?[78]00[\-\s]?\d{2,3}[\-\s]?\d{3,4}|0[2-9]\d?[\-\s]?\d{3}[\-\s]?\d{4}|0[2-9]\d?[\-\s]?\d{7})/g)].map(m=>m[1].replace(/\s/g,''));
  if(phones.length) out.phones=[...new Set(phones)];

  // brand → provider
  for(const p of PROVIDERS){ if(p.brands.some(b=>low.includes(b.toLowerCase()))){ out.providerKey=p.key; out.brand=p.brands.find(b=>low.includes(b.toLowerCase())).trim(); break; } }

  // category — keyword score
  let bestCat='other',bestScore=0;
  for(const c of CATS){ let s=0; for(const k of c.kw){ if(low.includes(k.toLowerCase())) s+= k.length>4?2:1 } if(s>bestScore){bestScore=s;bestCat=c.id} }
  out.category=bestCat;

  // store
  const st = KNOWN_STORES.find(s=>low.includes(s.toLowerCase()));
  if(st) out.store=st;
  else { const cand=lines.slice(0,5).find(l=>/[א-תa-z]{3,}/i.test(l)&&!/(חשבונית|קבלה|invoice|receipt|תאריך|עוסק|ח\.?פ|טל)/i.test(l)&&l.length<34); if(cand) out.store=cand.replace(/[^֐-׿a-zA-Z0-9 '"\-.&]/g,'').trim(); }

  // product name — a line with a category keyword or brand, without prices
  const kwAll = CATS.flatMap(c=>c.kw).concat(out.brand?[out.brand]:[]);
  const pl = lines.find(l=>kwAll.some(k=>k&&l.toLowerCase().includes(k.toLowerCase())) && l.length<70 && !/(סה["״']?כ|לתשלום|total)/i.test(l));
  if(pl) out.name = pl.replace(/\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{2}/g,'').replace(/\s\d{1,2}\s*$/,'').replace(/[₪*:]+/g,' ').replace(/\s{2,}/g,' ').trim().slice(0,60);

  // warranty length
  const wm = text.match(/(?:אחריות[^\n\d]{0,12})(\d{1,2})\s*(שנים|שנה|שנות|חודשים|חודש)|(\d{1,2})\s*(שנים|שנה|שנות|חודשים|חודש)\s*אחריות/);
  if(wm){ const n=+(wm[1]||wm[3]); const u=wm[2]||wm[4]; out.warrantyMonths = /חוד/.test(u)?n:n*12; }
  else if(/שנתיים\s*אחריות|אחריות\s*(ל)?שנתיים/.test(text)) out.warrantyMonths=24;
  else if(/(שלוש|3)\s*שנות?\s*אחריות/.test(text)) out.warrantyMonths=36;

  // serial
  const sn = text.match(/(?:S\/N|SN|מס['׳]?\s*סידורי|serial)[:\s#]*([A-Z0-9\-]{5,})/i);
  if(sn) out.serial = sn[1];
  return out;
}

/* ---------- share helpers (native share sheet on Android, Web Share elsewhere) ---------- */
const Cap = ()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()?window.Capacitor:null;
function openExt(url){ const c=Cap(); if(c&&c.Plugins&&c.Plugins.Browser){c.Plugins.Browser.open({url});return} const w=window.open(url,'_blank'); if(!w) location.href=url; }
async function shareFile({dataUrl,base64,mime,filename,title,text}){
  const c=Cap();
  const b64 = base64 || (dataUrl?dataUrl.split(',')[1]:'');
  if(c&&c.Plugins&&c.Plugins.Share&&c.Plugins.Filesystem){
    const w = await c.Plugins.Filesystem.writeFile({path:filename,data:b64,directory:'CACHE'});
    await c.Plugins.Share.share({title,text,files:[w.uri],dialogTitle:title});
    return true;
  }
  try{
    const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const file=new File([u],filename,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title,text});return true}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    return false;
  }catch(e){ if(e&&e.name==='AbortError')return true; throw e }
}
async function shareText(text,title){const c=Cap();if(c&&c.Plugins&&c.Plugins.Share){await c.Plugins.Share.share({title,text,dialogTitle:title});return}if(navigator.share){try{await navigator.share({title,text})}catch(e){}return}await copy(text);toast('הטקסט הועתק')}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();return true}}

let draft=null, attachTarget=null;
function startCapture(){
  if(Cloud.viewer()){toast('יש לך הרשאת צפייה בלבד. בקשו ממנהל משק הבית הרשאת הוספה');return}
  openSheet(`<div class="grip"></div><h3>חשבונית חדשה</h3><p class="lead">צלמו את החשבונית כשהיא ישרה ומוארת. הזיהוי עובד בעברית ובאנגלית.</p>
  <div class="btn-row"><button class="btn btn-primary" id="cCam">${ico('camera',22,2)} צילום</button><button class="btn btn-ghost" id="cGal">${ico('image',22)} מהגלריה</button></div>
  <button class="btn btn-ghost btn-block" id="cMan" style="margin-top:10px">${ico('edit',20)} הוספה ידנית בלי חשבונית</button>`,(sh)=>{
    sh.querySelector('#cCam').onclick=()=>pick('camInput');
    sh.querySelector('#cGal').onclick=()=>pick('galInput');
    sh.querySelector('#cMan').onclick=()=>{closeSheet();draft=newDraft();openEditor(draft,true)};
  });
}
function pick(id){const inp=document.getElementById(id);inp.value='';inp.click()}
function newDraft(){return{id:uid(),name:'',category:'other',store:'',purchaseDate:today(),warrantyMonths:12,amount:'',providerKey:'',providerName:'',providerPhone:'',providerUrl:'',providerEmail:'',brand:'',model:'',serial:'',notes:'',invoiceId:'',cardId:'',auto:{}}}
['camInput','galInput'].forEach(id=>document.getElementById(id).addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;closeSheet();
  const raw=await readFile(f);const img=await compress(raw);
  if(attachTarget){ // photo for a product that already exists: attach it, no re-scan
    const it=S.items.find(x=>x.id===attachTarget);attachTarget=null;if(!it)return;
    const id='f_'+uid();await DB.put('files',{id,data:img});it.invoiceId=id;it.updatedAt=Date.now();await DB.put('items',it);Cloud.pushItem(it,true);
    swap(()=>openDetail(it.id));toast('החשבונית צורפה');return;
  }
  draft=newDraft();draft._img=img;
  openScan(img);
}));
document.getElementById('cardInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!draft)return;draft._card=await compress(await readFile(f));toast('תעודת האחריות צורפה');const el=document.getElementById('cardState');if(el)el.textContent='צורפה ✓'});

function openScan(img){
  openPage(`<div class="page-bar"><button class="icon-btn" data-close aria-label="ביטול">${ico('close',20)}</button><h1>קורא את החשבונית</h1></div>
   <div class="cap-preview"><img src="${img}" alt="החשבונית שצולמה"><div class="scan-line"></div></div>
   <div class="progress" role="progressbar" aria-label="התקדמות הזיהוי" aria-valuemin="0" aria-valuemax="100"><i id="pbar"></i></div>
   <div class="ocr-status" id="pstat">מכין את התמונה…</div>
   <button class="btn btn-ghost btn-block" id="skipOcr" style="margin-top:16px">דלג ומלא ידנית</button>`,async pg=>{
    let cancelled=false;
    pg.querySelector('#skipOcr').onclick=()=>{cancelled=true;swap(()=>openEditor(draft,true))};
    try{
      const text=await runOCR(img,(p,msg)=>{if(cancelled)return;const b=document.getElementById('pbar');if(b){b.style.width=Math.round(p*100)+'%';b.parentElement.setAttribute('aria-valuenow',Math.round(p*100))}const s=document.getElementById('pstat');if(s)s.textContent=msg});
      if(cancelled)return;
      applyParsed(draft,parseInvoice(text));draft.ocrText=text.slice(0,4000);
      swap(()=>openEditor(draft,true));
    }catch(err){
      if(cancelled)return;
      swap(()=>openEditor(draft,true));
      toast('הזיהוי האוטומטי דורש חיבור לאינטרנט בפעם הראשונה. אפשר למלא ידנית');
    }
  });
}
function applyParsed(d,p){
  const a={};
  for(const k of ['name','store','purchaseDate','amount','warrantyMonths','serial','category','brand']) if(p[k]!==undefined&&p[k]!==''){d[k]=p[k];a[k]=1}
  if(p.category==='other')delete a.category;
  if(p.providerKey){const pr=providerByKey(p.providerKey);d.providerKey=pr.key;d.providerName=pr.name;d.providerPhone=pr.phone||'';d.providerUrl=pr.url||'';d.providerEmail=pr.email||'';a.provider=1}
  if(!d.providerPhone&&p.phones&&p.phones.length){d.providerPhone=p.phones[0];a.providerPhone=1}
  d.auto=a;
}

function openEditor(d,isNew){
  const a=d.auto||{};
  const autoB=k=>a[k]?`<span class="auto-badge">${ico('sparkle',12,2)} זוהה</span>`:'';

    <div class="grid2"><label class="field"><span>חודשים</span><input name="warrantyMonths" inputmode="numeric" value="${esc(d.warrantyMonths)}"></label><label class="field"><span>אחריות עד</span><input type="date" name="expiryDate" value="${esc(expiryOf(d))}"></label></div>
    <p class="hint" style="margin:-4px 2px 12px;font-size:12.5px;color:var(--muted)">לפי תקנות הגנת הצרכן, מוצר חשמל חדש מעל 150 ₪ מקבל לפחות שנת אחריות.</p>
   </div>
   <div class="card form-card"><h4>נותן האחריות ${a.provider?`<span class="auto-badge">${ico('sparkle',12,2)} סונכרן</span>`:''}</h4>
    <label class="field"><span>בחירה מהרשימה</span><select name="providerKey"><option value="">אחר / יבואן אחר</option>${prov}</select></label>
    <label class="field"><span>שם נותן האחריות</span><input name="providerName" value="${esc(d.providerName)}" placeholder="יבואן, מעבדה או החנות"></label>

    <label class="field"><span>דף שירות / צור קשר</span><input name="providerUrl" type="url" dir="ltr" style="text-align:right" value="${esc(d.providerUrl)}" placeholder="https://"></label>
   </div>
   <div class="card form-card"><h4>קבצים והערות</h4>
    <button type="button" class="btn btn-ghost btn-block btn-sm" id="addCard" style="margin-bottom:12px">${ico('doc',18)} צרף תעודת אחריות <span id="cardState" style="color:var(--muted);font-weight:500">${d._card||d.cardId?'צורפה ✓':''}</span></button>
    <label class="field"><span>הערות</span><textarea name="notes" placeholder="למשל: הוזמנה התקנה, מספר הזמנה…">${esc(d.notes)}</textarea></label>

    const syncExp=()=>{const pd=f.purchaseDate.value,m=+f.warrantyMonths.value;if(pd&&m)f.expiryDate.value=addMonths(pd,m)};
    pg.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{pg.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));if(b.dataset.m==='x'){f.warrantyMonths.focus();return}f.warrantyMonths.value=b.dataset.m;syncExp()});
    f.purchaseDate.oninput=syncExp;f.warrantyMonths.oninput=syncExp;
    f.providerKey.onchange=()=>{const p=providerByKey(f.providerKey.value);if(!p)return;f.providerName.value=p.name;f.providerPhone.value=p.phone||f.providerPhone.value;f.providerUrl.value=p.url||'';f.providerEmail.value=p.email||''};
    f.brand.onchange=()=>{const v=' '+f.brand.value.toLowerCase()+' ';const p=PROVIDERS.find(p=>p.brands.some(b=>v.includes(b.trim().toLowerCase())));if(p&&!f.providerKey.value){f.providerKey.value=p.key;f.providerKey.onchange()}};
    f.name.onchange=()=>{if(d.category!=='other')return;const g=parseInvoice(f.name.value);if(g.category!=='other'){d.category=g.category;pg.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===d.category))}};
    pg.querySelector('#addCard').onclick=()=>pick('cardInput');
    f.onsubmit=async e=>{
      e.preventDefault();
      if(!f.name.value.trim()){f.name.focus();f.name.style.borderColor='var(--danger)';toast('צריך שם למוצר');return}
      const fd=Object.fromEntries(new FormData(f));
      Object.assign(d,fd);
      d.amount=fd.amount?parseFloat(String(fd.amount).replace(/[^\d.]/g,'')):'';
      d.warrantyMonths=+fd.warrantyMonths||12;
      d.expiryDate=fd.expiryDate&&fd.expiryDate!==addMonths(d.purchaseDate,d.warrantyMonths)?fd.expiryDate:'';
      await saveItem(d,isNew);
      toast(isNew?'המוצר נשמר ומוין לקטגוריה':'השינויים נשמרו');
      if(isNew){closePage();render()}else{render();swap(()=>openDetail(d.id))}
    };
  });
}
async function saveItem(d,isNew){
  if(Cloud.viewer()){toast('יש לך הרשאת צפייה בלבד');throw new Error('viewer')}
  if(d._img){const id='f_'+uid();await DB.put('files',{id,data:d._img});d.invoiceId=id}
  if(d._card){const id='f_'+uid();await DB.put('files',{id,data:d._card});d.cardId=id}
  const newFiles=!!(d._img||d._card);
  delete d._img;delete d._card;
  const now=Date.now();
  const it={...d,updatedAt:now,createdAt:d.createdAt||now,addedBy:d.addedBy||S.settings.userName||''};
  delete it.auto;
  await DB.put('items',it);
  const i=S.items.findIndex(x=>x.id===it.id);if(i>=0)S.items[i]=it;else S.items.push(it);
  Cloud.pushItem(it,newFiles);
}

function fname(it,kind='invoice'){return `${kind}-${(it.name||'item').replace(/[^\w֐-׿]+/g,'-').slice(0,40)}.jpg`}
async function sendInvoice(it,dataUrl,mode){
  const text = mode==='claim'?claimMessage(it):itemSummary(it);
  try{
    const ok = await shareFile({dataUrl,mime:'image/jpeg',filename:fname(it),title:mode==='mail'?`חשבונית: ${it.name}`:mode==='claim'?'פנייה למימוש אחריות':'שליחת חשבונית',text});
    if(ok) return;
  }catch(e){}
  // fallback when the device cannot share files: the image was downloaded, open the app with the text
  if(mode==='mail') location.href=`mailto:?subject=${encodeURIComponent('חשבונית: '+it.name)}&body=${encodeURIComponent(text+'\n\n(התמונה הורדה למכשיר, יש לצרף אותה)')}`;
  else openExt(waLink(text));
}
async function sendClaimMail(it,inv){
  const subject=`בקשה למימוש אחריות: ${it.name}${it.serial?' · '+it.serial:''}`;
  const body=claimMessage(it);
  if(inv){ await copy(it.providerEmail); try{ const ok=await shareFile({dataUrl:inv.data,mime:'image/jpeg',filename:fname(it),title:subject,text:body}); if(ok){toast('כתובת המייל של נותן האחריות הועתקה');return} }catch(e){} }
  location.href=`mailto:${encodeURIComponent(it.providerEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
async function shareItem(it,inv){
  openSheet(`<div class="grip"></div><h3>שיתוף ${esc(it.name)}</h3><p class="lead">שולחים את פרטי המוצר, עם החשבונית או בלעדיה.</p>
   <div class="list"><button class="btn btn-wa btn-block" id="sWa">${ico('wa',22)} פרטים בוואטסאפ</button>${inv?`<button class="btn btn-ghost btn-block" id="sInv">${ico('image',20)} פרטים + חשבונית</button>`:''}<button class="btn btn-ghost btn-block" id="sPkg">${ico('users',20)} הזמנה לצפייה והוספה</button></div>`,sh=>{
    sh.querySelector('#sWa').onclick=()=>{closeSheet();openExt(waLink(itemSummary(it)))};
    if(inv)sh.querySelector('#sInv').onclick=()=>{closeSheet();sendInvoice(it,inv.data,'wa')};
    sh.querySelector('#sPkg').onclick=()=>{closeSheet();location.hash='share'};
  });
}

/* ---------- viewer ---------- */
function openViewer(it,src,label){
  const v=document.createElement('div');v.className='viewer';v.setAttribute('role','dialog');v.setAttribute('aria-label',label);
  v.innerHTML=`<div class="viewer-bar"><button class="icon-btn" aria-label="סגירה" data-x>${ico('close',20)}</button><b style="flex:1">${esc(label)} · ${esc(it.name)}</b></div><div class="viewer-img"><img src="${src}" alt="${esc(label)}"></div>
   <div class="viewer-actions"><button class="btn btn-wa btn-sm" data-a="wa">${ico('wa',19)} וואטסאפ</button><button class="btn btn-ghost btn-sm" data-a="mail">${ico('mail',19)} מייל</button><button class="btn btn-ghost btn-sm" data-a="dl">${ico('download',19)} שמירה</button></div>`;
  document.body.appendChild(v);
  v.querySelector('[data-x]').onclick=()=>v.remove();
  v.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;if(a==='dl'){const l=document.createElement('a');l.href=src;l.download=fname(it,label==='חשבונית'?'invoice':'warranty');l.click();return}sendInvoice(it,src,a)});
}

/* ---------- household sharing ---------- */
async function buildPackage(role){
  const items=S.items;const files={};
  for(const it of items){ if(it.deleted)continue; for(const k of ['invoiceId','cardId']) if(it[k]){const f=await DB.get('files',it[k]);if(f)files[f.id]=f.data} }
  return {app:'bachrayut',v:1,household:S.household,from:S.settings.userName||'',role:role||'editor',exportedAt:Date.now(),items,files};
}
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
async function sendPackage(role,invite){
  if(!S.household){S.household={id:uid(),name:(S.settings.userName?`הבית של ${S.settings.userName}`:'הבית שלנו')};await DB.setMeta('household',S.household)}
  const pkg=await buildPackage(role);
  const name=S.settings.userName||'בן/בת המשפחה';
  const text = invite
   ? `${name} מזמין/ה אותך לנהל יחד את האחריות של "${S.household.name}" באפליקציית באחריות.\n\n1. מתקינים את האפליקציה: ${APP_LINK}\n2. פותחים את הקובץ המצורף מתוך האפליקציה: שיתוף > קבלת עדכון.\n${role==='viewer'?'\nההזמנה היא לצפייה בלבד.':'\nאפשר להוסיף מוצרים ולשלוח לי עדכון באותה דרך.'}`
   : `עדכון אחריות מ־${name}: ${live().length} מוצרים. פותחים את הקובץ באפליקציית באחריות: שיתוף > קבלת עדכון.`;
  const ok=await shareFile({base64:b64utf8(JSON.stringify(pkg)),mime:'application/json',filename:`bachrayut-${new Date().toISOString().slice(0,10)}.json`,title:invite?'הזמנה לבאחריות':'עדכון לבאחריות',text}).catch(()=>false);
  if(!ok){ openExt(waLink(text)); toast('הקובץ נשמר בהורדות. מצרפים אותו להודעה'); }
}
async function importPackage(file){
  let pkg;try{pkg=JSON.parse(await file.text())}catch(e){toast('הקובץ לא נקרא');return}
  if(!pkg||pkg.app!=='bachrayut'||!Array.isArray(pkg.items)){toast('זה לא קובץ של באחריות');return}
  let added=0,updated=0;
  for(const [id,data] of Object.entries(pkg.files||{})){ if(!(await DB.get('files',id))) await DB.put('files',{id,data}) }
  for(const r of pkg.items){
    const l=S.items.find(x=>x.id===r.id);
    if(!l||(r.updatedAt||0)>(l.updatedAt||0)){
      const it={...r,readOnly:pkg.role==='viewer'?true:(l?l.readOnly:false)};
      await DB.put('items',it); if(l){Object.assign(l,it);if(!r.deleted)updated++} else {S.items.push(it);if(!r.deleted)added++}
      Cloud.pushItem(it,true);
    }
  }
  if(pkg.household&&!S.household){S.household=pkg.household;await DB.setMeta('household',S.household)}
  if(pkg.from&&!S.members.find(m=>m.name===pkg.from)){S.members.push({name:pkg.from,role:'owner',at:Date.now()});await DB.setMeta('members',S.members)}
  render();toast(`התקבל עדכון: ${added} חדשים, ${updated} עודכנו`);
}
document.getElementById('importInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)importPackage(f)});

/* ---------- cloud household (Firebase Auth + Firestore) ----------
   households/{hid}            name, ownerId, memberIds[], members{uid:{name,email,role}}
   households/{hid}/items/{id} the product (same fields as on the device)
   households/{hid}/files/{id} invoice / warranty image as a data URL (kept under 1MB)
   invites/{code}              hid, role, householdName, createdBy, expiresAt
   users/{uid}                 hid
   Roles are enforced by firestore.rules: owner and editor write, viewer reads. */
const Cloud = {
  ready:false, user:null, hid:null, hh:null, role:null, unsubs:[], F:null, auth:null, db:null, state:'off', err:'', pending:0,
  config(){ const c=window.FIREBASE_CONFIG||S.settings.firebaseConfig; return c&&c.apiKey&&c.projectId?c:null },
  async init(){
    const cfg=this.config(); if(!cfg){this.state='off';return false}
    try{
      if(!window.FB) await loadScript('vendor/firebase.js');
      const F=this.F=window.FB;
      const app=F.initializeApp(cfg);
      this.auth=F.initializeAuth(app,{persistence:[F.indexedDBLocalPersistence,F.browserLocalPersistence]});
      this.db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});
      if(window.FB_EMULATOR){F.connectAuthEmulator(this.auth,'http://127.0.0.1:9099',{disableWarnings:true});F.connectFirestoreEmulator(this.db,'127.0.0.1',8080)}
      this.ready=true;this.state='loading';
      F.onAuthStateChanged(this.auth,u=>this.onUser(u));
      return true;
    }catch(e){this.state='error';this.err='לא ניתן לטעון את Firebase';console.error(e);return false}
  },
  d(...p){return this.F.doc(this.db,...p)},
  stop(){this.unsubs.forEach(u=>{try{u()}catch(e){}});this.unsubs=[];this.hid=null;this.hh=null;this.role=null},
  async onUser(u){
    this.stop();this.user=u;
    if(!u){this.state='signedout';refresh();return}
    try{
      const us=await this.F.getDoc(this.d('users',u.uid));
      const hid=us.exists()?us.data().hid:null;
      if(!hid){this.state='nohousehold';refresh();return}
      await this.listen(hid);
    }catch(e){this.fail(e)}
  },
  fail(e){console.error(e);this.err=fbError(e);toast(this.err);refresh()},
  listen(hid){
    return new Promise((resolve)=>{
      const F=this.F;this.hid=hid;let first=true;
      this.unsubs.push(F.onSnapshot(this.d('households',hid),snap=>{
        if(!snap.exists()||!(snap.data().memberIds||[]).includes(this.user.uid)){this.leaveLocal();return}
        this.hh=snap.data();this.role=(this.hh.members[this.user.uid]||{}).role||'viewer';
        S.household={id:hid,name:this.hh.name};DB.setMeta('household',S.household);
        this.state='on';refresh();
      },e=>{this.fail(e);resolve()}));
      this.unsubs.push(F.onSnapshot(F.collection(this.db,'households',hid,'items'),async snap=>{
        const remoteIds=new Set();let changed=false;
        for(const ch of snap.docChanges()){
          const r=ch.doc.data();remoteIds.add(r.id);
          if(ch.type==='removed')continue;
          const l=S.items.find(x=>x.id===r.id);
          if(!l||(r.updatedAt||0)>(l.updatedAt||0)){
            const it={...r};delete it.readOnly;
            await DB.put('items',it);if(l)Object.assign(l,it);else S.items.push(it);changed=true;
            for(const k of ['invoiceId','cardId']) if(it[k]&&!(await DB.get('files',it[k]))) this.pullFile(it[k]);
          }
        }
        if(first){first=false;
          // first sync after joining or signing in: send what exists only on this device
          if(this.canEdit()) for(const l of S.items){ if(snap.docs.every(d=>d.id!==l.id) || (l.updatedAt||0)>((snap.docs.find(d=>d.id===l.id)||{data:()=>({})}).data().updatedAt||0)) this.pushItem(l,true) }
          resolve();
        }
        if(changed)refresh();
      },e=>{this.fail(e);resolve()}));
    });
  },
  canEdit(){return this.state==='on'&&(this.role==='owner'||this.role==='editor')},
  viewer(){return this.state==='on'&&this.role==='viewer'},
  clean(it){const o={};for(const [k,v] of Object.entries(it)){if(k.startsWith('_')||k==='auto'||k==='readOnly'||k==='ocrText'||v===undefined)continue;o[k]=v}return o},
  async pushItem(it,withFiles){
    if(!this.canEdit())return;
    this.pending++;refreshSync();
    try{
      if(withFiles||it._newFiles) for(const k of ['invoiceId','cardId']) if(it[k]) await this.pushFile(it[k],it.id);
      await this.F.setDoc(this.d('households',this.hid,'items',it.id),this.clean(it));
    }catch(e){this.fail(e)}finally{this.pending--;refreshSync()}
  },
  async pushFile(id,itemId){
    const f=await DB.get('files',id);if(!f)return;
    let data=f.data;
    for(const [max,q] of [[1700,.84],[1400,.72],[1100,.62],[900,.55]]){ if(data.length<950000)break; data=await compress(f.data,max,q) }
    await this.F.setDoc(this.d('households',this.hid,'files',id),{data,itemId:itemId||''});
  },
  async pullFile(id){try{const s=await this.F.getDoc(this.d('households',this.hid,'files',id));if(s.exists()){await DB.put('files',{id,data:s.data().data})}}catch(e){console.error(e)}},
  async signUp(name,email,pass){const F=this.F;const c=await F.createUserWithEmailAndPassword(this.auth,email,pass);if(name)await F.updateProfile(c.user,{displayName:name});if(name&&!S.settings.userName){S.settings.userName=name;await DB.setMeta('settings',S.settings)}},
  signIn(email,pass){return this.F.signInWithEmailAndPassword(this.auth,email,pass)},
  reset(email){return this.F.sendPasswordResetEmail(this.auth,email)},
  async signOut(){this.stop();await this.F.signOut(this.auth)},
  me(){return {name:S.settings.userName||this.user.displayName||this.user.email.split('@')[0],email:this.user.email}},
  async createHousehold(name){
    const F=this.F,u=this.user,hid='h_'+uid();
    await F.setDoc(this.d('households',hid),{name:name||'הבית שלנו',ownerId:u.uid,memberIds:[u.uid],members:{[u.uid]:{...this.me(),role:'owner'}},createdAt:Date.now()});
    await F.setDoc(this.d('users',u.uid),{hid});
    await this.listen(hid);
  },
  async invite(role){
    const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';const r=crypto.getRandomValues(new Uint32Array(8));for(const n of r)code+=A[n%A.length];
    await this.F.setDoc(this.d('invites',code),{hid:this.hid,role,householdName:this.hh.name,createdBy:this.user.uid,createdAt:Date.now(),expiresAt:Date.now()+7*864e5});
    return code;
  },
  async join(code){
    const F=this.F,u=this.user;code=code.toUpperCase().replace(/[^A-Z0-9]/g,'');
    const inv=await F.getDoc(this.d('invites',code));
    if(!inv.exists())throw {code:'bachrayut/no-invite'};
    const v=inv.data();if(v.expiresAt<Date.now())throw {code:'bachrayut/expired'};
    await F.updateDoc(this.d('households',v.hid),{memberIds:F.arrayUnion(u.uid),[`members.${u.uid}`]:{...this.me(),role:v.role},joinCode:code});
    await F.setDoc(this.d('users',u.uid),{hid:v.hid});
    this.stop();await this.listen(v.hid);
    return v;
  },
  async setRole(muid,role){await this.F.updateDoc(this.d('households',this.hid),{[`members.${muid}.role`]:role})},
  async removeMember(muid){const F=this.F;await F.updateDoc(this.d('households',this.hid),{memberIds:F.arrayRemove(muid),[`members.${muid}`]:F.deleteField()})},
  async rename(name){await this.F.updateDoc(this.d('households',this.hid),{name})},
  async leave(){const F=this.F,u=this.user;await F.updateDoc(this.d('households',this.hid),{memberIds:F.arrayRemove(u.uid),[`members.${u.uid}`]:F.deleteField()});this.leaveLocal()},
  async leaveLocal(){const u=this.user;this.stop();if(u){try{await this.F.setDoc(this.d('users',u.uid),{hid:null})}catch(e){}}this.state=u?'nohousehold':'signedout';S.household=null;await DB.setMeta('household',null);refresh()},
};
function fbError(e){const c=(e&&e.code)||'';return ({
  'auth/invalid-email':'כתובת המייל לא תקינה','auth/missing-password':'צריך סיסמה','auth/weak-password':'הסיסמה צריכה לפחות 6 תווים',
  'auth/email-already-in-use':'כבר יש חשבון עם המייל הזה. אפשר להתחבר','auth/invalid-credential':'המייל או הסיסמה לא נכונים',
  'auth/wrong-password':'המייל או הסיסמה לא נכונים','auth/user-not-found':'אין חשבון עם המייל הזה','auth/too-many-requests':'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות',
  'auth/network-request-failed':'אין חיבור לאינטרנט','auth/operation-not-allowed':'צריך להפעיל התחברות במייל וסיסמה בקונסולת Firebase',
  'permission-denied':'אין הרשאה לפעולה הזו','unavailable':'אין חיבור לשרת כרגע. השינויים יישלחו כשיחזור החיבור',
  'bachrayut/no-invite':'קוד ההזמנה לא נמצא','bachrayut/expired':'תוקף ההזמנה פג. בקשו קוד חדש',
}[c])||'משהו השתבש: '+(c||e.message||e)}

function inviteSheet(){
  let role='editor';
  const cloud=Cloud.state==='on';
  openSheet(`<div class="grip"></div><h3>הזמנה למשק הבית</h3><p class="lead">${cloud?'נשלח בוואטסאפ קוד הצטרפות וקישור להתקנה. הקוד בתוקף 7 ימים.':'ההזמנה נשלחת בוואטסאפ עם קישור להתקנה וקובץ של כל המוצרים.'}</p>
   ${cloud?'':`<label class="field"><span>שם המוזמן/ת</span><input id="invName" placeholder="למשל: דנה"></label>`}
   <div class="field" style="margin-bottom:6px"><span>הרשאה</span></div>
   <div class="seg" role="group" aria-label="הרשאה"><button type="button" data-r="editor" aria-pressed="true">צפייה והוספה</button><button type="button" data-r="viewer" aria-pressed="false">צפייה בלבד</button></div>
   ${S.settings.userName?'':`<label class="field"><span>השם שלך (יופיע בהזמנה)</span><input id="myName"></label>`}
   <button class="btn btn-wa btn-block" id="goInv">${ico('wa',22)} שליחת ההזמנה</button>`,sh=>{
    sh.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{role=b.dataset.r;sh.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    sh.querySelector('#goInv').onclick=async()=>{
      const my=sh.querySelector('#myName');if(my&&my.value.trim()){S.settings.userName=my.value.trim();await DB.setMeta('settings',S.settings)}
      if(cloud){
        try{
          const code=await Cloud.invite(role);closeSheet();
          const name=S.settings.userName||Cloud.me().name;
          const text=`${name} מזמין/ה אותך לנהל יחד את האחריות של "${Cloud.hh.name}" באפליקציית באחריות.\n\n1. מתקינים: ${APP_LINK}\n2. נכנסים לשיתוף, פותחים חשבון ומקלידים את הקוד:\n\n${code}\n\n${role==='viewer'?'ההזמנה לצפייה בלבד.':'אפשר לראות ולהוסיף מוצרים.'} הקוד בתוקף 7 ימים.`;
          openExt(waLink(text));
        }catch(e){toast(fbError(e))}
        return;
      }
      const n=sh.querySelector('#invName').value.trim()||'מוזמן/ת';
      S.members.push({name:n,role,at:Date.now()});await DB.setMeta('members',S.members);
      closeSheet();await sendPackage(role,true);renderShare();
    };
  });
}

function renderShareLocal(){
  const colors=['#0F6B4F','#B7791F','#1E3A8A','#BE185D','#0E7490'];
  const me=S.settings.userName||'אני';
  const mem=[{name:me,role:'me'},...S.members];
  app.innerHTML=topbar('ניהול משותף עם המשפחה')+`<main id="main">
   <section class="summary m-enter" aria-labelledby="shH" style="padding-bottom:18px"><div class="summary-label">משק בית</div><h2 id="shH" class="summary-value" style="font-size:32px">${esc(S.household?S.household.name:'עוד לא שיתפתם')}</h2><p style="margin:6px 0 14px;opacity:.9;font-size:14.5px">מזמינים בן או בת משפחה בוואטסאפ, והם רואים את כל המוצרים והחשבוניות ויכולים להוסיף משלהם.</p>
   <button class="btn btn-block" id="inv" style="background:var(--hero-btn-bg);color:var(--hero-btn-ink)">${ico('wa',22)} הזמנה בוואטסאפ</button></section>
   <div class="sec-head"><h2>חברי משק הבית</h2><span class="meta">${mem.length}</span></div>
   <section class="card">${mem.map((m,i)=>`<div class="member"><span class="av" style="background:${colors[i%colors.length]}">${esc(m.name.trim()[0]||'?')}</span><div><b>${esc(m.name)}</b><span>${m.role==='me'?'את/ה':m.role==='viewer'?'הוזמן/ה לצפייה':m.role==='owner'?'שיתף/ה איתך':'הוזמן/ה לצפייה והוספה'}</span></div><span class="role">${m.role==='viewer'?'צפייה':m.role==='me'?'מנהל/ת':'עורך/ת'}</span></div>`).join('')}</section>
   <div class="sec-head"><h2>סנכרון</h2></div>
   <section class="card" style="overflow:hidden">
    <button class="row-link" id="sendUp"><span class="ri">${ico('upload',20)}</span><div><b>שליחת עדכון</b><span>כל המוצרים והחשבוניות, בקובץ אחד</span></div></button>
    <button class="row-link" id="getUp"><span class="ri">${ico('download',20)}</span><div><b>קבלת עדכון</b><span>פתיחת קובץ שקיבלתם בוואטסאפ או במייל</span></div></button>
   </section>
   <p class="note" style="margin-top:14px">העדכונים מתמזגים: מוצר שנוסף אצל אחד מופיע אצל השני, והגרסה האחרונה של כל מוצר נשמרת. לסנכרון אוטומטי בזמן אמת מחברים את Firebase בהגדרות.</p>
  </main>`;
  bindTop();
  document.getElementById('inv').onclick=()=>inviteSheet();
  document.getElementById('sendUp').onclick=()=>sendPackage('editor',false);
  document.getElementById('getUp').onclick=()=>pick('importInput');
}

/* ---------- settings ---------- */
function renderSettings(){
  app.innerHTML=topbar('הגדרות וגיבוי')+`<main id="main">
   <div class="sec-head" style="margin-top:4px"><h2>פרופיל</h2></div>
   <section class="card form-card"><label class="field"><span>השם שלך</span><input id="sName" value="${esc(S.settings.userName)}" placeholder="יופיע בפניות ובשיתוף"></label>
   <label class="field"><span>שם משק הבית</span><input id="sHouse" value="${esc(S.household?S.household.name:'')}" placeholder="הבית שלנו"></label></section>
   <div class="sec-head"><h2>עיצוב</h2><span class="meta">${SKINS.length} סגנונות</span></div>
   <div class="skins" role="group" aria-label="עיצוב האפליקציה">${SKINS.map(skinCard).join('')}</div>
   <div class="sec-head"><h2>בהיר או כהה</h2></div>
   ${(SKINS.find(k=>k.id===(S.settings.skin||'forest'))||{}).fixed?`<p class="note">העיצוב הזה כהה תמיד.</p>`:`<div class="seg" role="group" aria-label="בהיר או כהה">${[['auto','לפי המכשיר'],['light','בהיר'],['dark','כהה']].map(([k,l])=>`<button data-t="${k}" aria-pressed="${S.settings.theme===k}">${l}</button>`).join('')}</div>`}
   <div class="sec-head"><h2>גיבוי</h2></div>
   <section class="card" style="overflow:hidden">
    <button class="row-link" id="bk"><span class="ri">${ico('download',20)}</span><div><b>גיבוי מלא</b><span>קובץ אחד עם כל המוצרים והחשבוניות</span></div></button>
    <button class="row-link" id="rs"><span class="ri">${ico('upload',20)}</span><div><b>שחזור מגיבוי</b><span>ממזג עם מה שכבר שמור</span></div></button>
   </section>
   <div class="sec-head"><h2>סנכרון בענן</h2><span class="meta">${Cloud.state==='on'?'מחובר':Cloud.config()?'מוגדר':'לא מוגדר'}</span></div>
   ${window.FIREBASE_CONFIG?`<p class="note">הסנכרון מוגדר בתוך האפליקציה (פרויקט ${esc(window.FIREBASE_CONFIG.projectId)}).</p>`:S.settings.firebaseConfig?`<section class="card" style="overflow:hidden"><div class="row-link" style="cursor:default"><span class="ri">${ico('shield',18)}</span><div><b>Firebase: ${esc(S.settings.firebaseConfig.projectId)}</b><span>הוגדר במכשיר הזה</span></div></div><button class="row-link" id="fbClear"><span class="ri">${ico('trash',18)}</span><div><b>ניתוק ההגדרה</b><span>המוצרים נשארים במכשיר</span></div></button></section>`
   :`<section class="card form-card"><label class="field"><span>הגדרות Firebase</span><textarea id="fbCfg" dir="ltr" style="text-align:left;font-size:13px;min-height:120px" placeholder="const firebaseConfig = { apiKey: ..., projectId: ... }"></textarea><p class="hint">מדביקים את קטע ההגדרות מ־Firebase: הגדרות הפרויקט > האפליקציות שלך > אפליקציית ווב.</p></label><button class="btn btn-primary btn-block btn-sm" id="fbSave" style="margin-bottom:12px">חיבור</button></section>`}
   <div class="sec-head"><h2>נותני אחריות שמורים</h2><span class="meta">${PROVIDERS.length}</span></div>
   <section class="card" style="overflow:hidden">${PROVIDERS.map(p=>`<div class="row-link" style="cursor:default"><span class="ri">${ico('shield',18)}</span><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><span dir="auto">${esc(p.phone||'')}${p.phone&&p.url?' · ':''}${p.url?esc(new URL(p.url).hostname.replace('www.','')):''}${!p.phone&&!p.url?'זיהוי מותג בלבד':''}</span></div></div>`).join('')}</section>
   <p class="note" style="margin-top:14px">זיהוי החשבונית רץ במכשיר עצמו. בלי סנכרון בענן הנתונים נשמרים רק במכשיר; עם סנכרון הם נשמרים גם בפרויקט Firebase שלך ונגישים רק לחברי משק הבית.</p>
  </main>`;
  bindTop();
  const sn=document.getElementById('sName'),sh=document.getElementById('sHouse');
  sn.onchange=async()=>{S.settings.userName=sn.value.trim();await DB.setMeta('settings',S.settings);toast('נשמר')};
  sh.onchange=async()=>{const v=sh.value.trim()||'הבית שלנו';if(Cloud.state==='on'){if(Cloud.role!=='owner'){toast('רק מנהל/ת משק הבית משנה את השם');sh.value=S.household.name;return}try{await Cloud.rename(v)}catch(e){toast(fbError(e));return}}S.household=S.household||{id:uid()};S.household.name=v;await DB.setMeta('household',S.household);toast('נשמר')};
  const fc=document.getElementById('fbCfg');
  if(fc)document.getElementById('fbSave').onclick=async()=>{const c=parseFbConfig(fc.value);if(!c){toast('לא נמצאו apiKey ו־projectId בטקסט');return}S.settings.firebaseConfig=c;await DB.setMeta('settings',S.settings);toast('Firebase חובר. ממשיכים בלשונית שיתוף');setTimeout(()=>location.reload(),900)};
  const fr=document.getElementById('fbClear');if(fr)fr.onclick=async()=>{delete S.settings.firebaseConfig;await DB.setMeta('settings',S.settings);location.reload()};
  app.querySelectorAll('[data-skin-pick]').forEach(b=>b.onclick=async()=>{S.settings.skin=b.dataset.skinPick;applyTheme();await DB.setMeta('settings',S.settings);const y=scrollY;renderSettings();scrollTo(0,y);toast(`העיצוב הוחלף ל${SKINS.find(k=>k.id===S.settings.skin).name}`)});
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{S.settings.theme=b.dataset.t;await DB.setMeta('settings',S.settings);applyTheme();renderSettings()});
  document.getElementById('bk').onclick=async()=>{const pkg=await buildPackage('editor');await shareFile({base64:b64utf8(JSON.stringify(pkg)),mime:'application/json',filename:`bachrayut-backup-${today()}.json`,title:'גיבוי באחריות',text:'גיבוי של באחריות'}).catch(()=>{})};
  document.getElementById('rs').onclick=()=>pick('importInput');
}
function parseFbConfig(t){const o={};for(const k of ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId']){const m=t.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]}return o.apiKey&&o.projectId?o:null}
const SKINS=[
 {id:'forest',name:'יער',desc:'ירוק על נייר',bg:'#F3EFE6',card:'#FFFDF8',hero:'#0F6B4F',heroInk:'#fff',ink:'#14201B',acc:'#0F6B4F',font:"'Frank Ruhl Libre',serif",r:12},
 {id:'midnight',name:'זהב לילה',desc:'כחול חצות וזהב',bg:'#0B0E14',card:'#141924',hero:'linear-gradient(145deg,#1D2436,#0E121B)',heroInk:'#E6BE69',ink:'#F3EEE2',acc:'#D4A84F',font:"'Frank Ruhl Libre',serif",r:12,fixed:'dark',border:'rgba(212,168,79,.5)'},
 {id:'coast',name:'חוף',desc:'ים וחול',bg:'#EEF4F6',card:'#FFFFFF',hero:'linear-gradient(160deg,#0B6E99,#22B3A6)',heroInk:'#fff',ink:'#0E2430',acc:'#0B6E99',font:"'Rubik',sans-serif",r:16},
 {id:'paper',name:'עיתון',desc:'שחור, לבן ואדום',bg:'#F3EFE5',card:'#FBF8F1',hero:'#111',heroInk:'#fff',ink:'#111',acc:'#C8281A',font:"'Suez One',serif",r:2,border:'#111'},
 {id:'candy',name:'סוכריה',desc:'אפרסק ומנטה',bg:'#FFF6EF',card:'#FFFFFF',hero:'linear-gradient(135deg,#FFB39C,#FFD4A3 52%,#BDE8D2)',heroInk:'#3B2A2A',ink:'#3B2A2A',acc:'#E2725B',font:"'Secular One',sans-serif",r:18},
 {id:'neon',name:'ניאון',desc:'מסוף שחור וזוהר מנטה',bg:'#07090B',card:'#0E1215',hero:'linear-gradient(rgba(61,255,168,.12) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(61,255,168,.12) 1px,transparent 1px) 0 0/12px 12px,#0B1013',heroInk:'#3DFFA8',ink:'#E8FFF4',acc:'#3DFFA8',font:"'IBM Plex Sans Hebrew',sans-serif",r:8,fixed:'dark',border:'rgba(61,255,168,.45)',glow:true},
];
function skinCard(k){const on=(S.settings.skin||'forest')===k.id;
  return `<button class="skin" data-skin-pick="${k.id}" aria-pressed="${on}" aria-label="עיצוב ${k.name}: ${k.desc}">
   <div class="pv" style="background:${k.bg}">
    <div class="pv-hero" style="background:${k.hero};color:${k.heroInk};border-radius:${k.r}px;${k.border?`border:1px solid ${k.border};`:''}"><small style="font-family:${k.font}">באחריות</small><b style="font-family:${k.font};${k.glow?'text-shadow:0 0 12px rgba(61,255,168,.7)':''}">₪26,250</b></div>
    <div class="pv-row" style="background:${k.card};border-radius:${Math.max(2,k.r-4)}px;${k.border&&k.id==='paper'?'border:1.5px solid #111;':''}"><i style="background:${k.acc};border-radius:${Math.min(k.r,8)}px;opacity:.85"></i><span style="background:${k.ink}"></span><em style="border-color:${k.acc}"></em></div>
   </div>
   <div class="nm"><b>${k.name}</b><span>${k.fixed?'כהה תמיד':k.desc}</span></div>
   <span class="ok" aria-hidden="true">${ico('check',15,3)}</span></button>`}
function applyTheme(){const t=S.settings.theme,sk=S.settings.skin||'forest',el=document.documentElement;
  if(sk==='forest')el.removeAttribute('data-skin');else el.setAttribute('data-skin',sk);
  const fixed=(SKINS.find(k=>k.id===sk)||{}).fixed;
  if(fixed)el.setAttribute('data-theme',fixed);else if(t==='auto')el.removeAttribute('data-theme');else el.setAttribute('data-theme',t);
  requestAnimationFrame(()=>{const bg=getComputedStyle(document.body).backgroundColor;document.querySelectorAll('meta[name=theme-color]').forEach(m=>{m.content=bg;m.removeAttribute('media')})});
}
async function toggleTheme(){const sk=SKINS.find(k=>k.id===(S.settings.skin||'forest'));if(sk&&sk.fixed){const i=SKINS.indexOf(sk);S.settings.skin=SKINS[(i+1)%SKINS.length].id;applyTheme();await DB.setMeta('settings',S.settings);toast(`עיצוב: ${SKINS.find(k=>k.id===S.settings.skin).name}`);if(S.view==='settings')renderSettings();return}
  const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);S.settings.theme=dark?'light':'dark';applyTheme();await DB.setMeta('settings',S.settings)}

/* ---------- pages & sheets ---------- */
const pageStack=[];
let replaceNext=false;
function swap(fn){replaceNext=true;fn()}
function openPage(html,bind){if(replaceNext&&pageStack.length){pageStack.pop().remove()}const rep=replaceNext;replaceNext=false;const p=document.createElement('div');p.className='page';p.setAttribute('role','dialog');p.setAttribute('aria-modal','true');p.innerHTML=`<div class="page-in">${html}</div>`;layer.appendChild(p);pageStack.push(p);p.querySelectorAll('[data-close]').forEach(b=>b.onclick=closePage);if(!rep)history.pushState({p:pageStack.length},'');bind&&bind(p);const f=p.querySelector('h1,button');f&&f.focus&&setTimeout(()=>p.querySelector('[data-close]')?.focus(),50)}
function closePage(fromPop){const p=pageStack.pop();if(p)p.remove();if(!fromPop&&history.state&&history.state.p)history.back()}
let sheetEl=null;
function openSheet(html,bind){closeSheet();const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;o.onclick=e=>{if(e.target===o)closeSheet()};document.body.appendChild(o);sheetEl=o;bind&&bind(o);setTimeout(()=>o.querySelector('button,input')?.focus(),60)}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null}}
function confirmSheet(title,text,okLabel,onOk){openSheet(`<div class="grip"></div><h3>${esc(title)}</h3><p class="lead">${esc(text)}</p><div class="btn-row"><button class="btn btn-ghost" id="no">ביטול</button><button class="btn btn-danger" id="yes" style="background:var(--danger);color:#fff">${esc(okLabel)}</button></div>`,s=>{s.querySelector('#no').onclick=closeSheet;s.querySelector('#yes').onclick=()=>{closeSheet();onOk()}})}
addEventListener('popstate',()=>{if(sheetEl){closeSheet();return}if(document.querySelector('.viewer')){document.querySelector('.viewer').remove();return}if(pageStack.length)closePage(true)});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheetEl)closeSheet();else if(document.querySelector('.viewer'))document.querySelector('.viewer').remove();else if(pageStack.length)history.back()}});

/* ---------- routing ---------- */
function route(){const h=(location.hash||'#home').slice(1);S.view=['home','cats','share','settings'].includes(h)?h:'home';while(pageStack.length){pageStack.pop().remove()}render();scrollTo(0,0)}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openDetail(b.dataset.open)});


/* ---------- boot ---------- */
(async function boot(){
  try{await DB.open()}catch(e){app.innerHTML='<p style="padding:24px">לא ניתן לפתוח את האחסון במכשיר.</p>';return}
  S.items=await DB.all('items');
  S.settings=Object.assign(S.settings,await DB.meta('settings',{}));
  S.household=await DB.meta('household',null);
  S.members=await DB.meta('members',[]);
  applyTheme();route();
  setTimeout(()=>document.body.classList.add('booted'),700);
  Cloud.init();
})();
</script>
