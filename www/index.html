<title>ג'ולייטה – יומן טיפולים ומעקב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d10; --bg2:#121317; --card:#181a1f; --card2:#1f2127; --line:#2a2d35;
  --tx:#eeeae3; --mut:#9a9ca4; --rosso:#c4162a; --rosso2:#e23446; --gold:#c9a45a;
  --ok:#3fb37f; --soon:#e5a22e; --over:#ef4a41; --ver:#8aa4ff; --unk:#8b8f99;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Rubik',system-ui,sans-serif;font-size:15px;line-height:1.45}
body{
  background:
   radial-gradient(900px 380px at 85% -80px, rgba(196,22,42,.22), transparent 60%),
   repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 6px),
   var(--bg);
  min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.brand small{display:block;letter-spacing:.32em;color:var(--gold);font-size:10.5px;font-weight:500;direction:ltr;text-align:right}
.brand h1{margin:2px 0 0;font-size:27px;font-weight:700;letter-spacing:.01em}
.brand h1 span{color:var(--rosso2)}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mut);background:rgba(255,255,255,.03);white-space:nowrap}
main{padding:10px 14px 0;max-width:720px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;position:relative}
h2{font-size:13px;letter-spacing:.04em;color:var(--mut);font-weight:500;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11.5px;color:var(--tx)}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.btn.red{background:var(--rosso);border-color:var(--rosso);font-weight:600}
.btn.ghost{background:transparent}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1}
.mut{color:var(--mut)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* gauge */
.gwrap{display:flex;gap:6px;align-items:center}
.gauge{width:58%;max-width:250px;flex:none}
.gside{flex:1;display:flex;flex-direction:column;gap:10px}
.kv small{display:block;color:var(--mut);font-size:11.5px}
.kv b{font-size:17px;font-weight:600}
.kv b i{font-style:normal;font-size:12px;color:var(--mut);font-weight:400}

/* test */
.test{border-color:#4a2228;background:linear-gradient(135deg,#2a1217,#15161a 70%)}
.test.calm{border-color:var(--line);background:linear-gradient(180deg,var(--card),var(--bg2))}
.big{font-size:46px;font-weight:700;line-height:1;direction:ltr;display:inline-block}
.big small{font-size:15px;font-weight:400;color:var(--mut);margin-inline-start:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--card2)}
.chip.ok{color:var(--ok);border-color:rgba(63,179,127,.4)}
.chip.warn{color:var(--soon);border-color:rgba(229,162,46,.45)}

/* rings */
.rings{display:flex;gap:10px;justify-content:space-around;margin-top:10px}
.ring{text-align:center;flex:1}
.ring svg{width:104px;height:104px;display:block;margin:0 auto}
.ring .t{font-size:12px;color:var(--mut);margin-top:2px}
.ring text{fill:var(--tx);font-family:'Rubik',sans-serif}

/* badges / items */
.badge{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid;white-space:nowrap;font-weight:500}
.badge.ok{color:var(--ok);border-color:rgba(63,179,127,.45);background:rgba(63,179,127,.08)}
.badge.soon{color:var(--soon);border-color:rgba(229,162,46,.5);background:rgba(229,162,46,.09)}
.badge.over{color:var(--over);border-color:rgba(239,74,65,.55);background:rgba(239,74,65,.1)}
.badge.verify{color:var(--ver);border-color:rgba(138,164,255,.5);background:rgba(138,164,255,.09)}
.badge.unknown{color:var(--unk);border-color:var(--line)}
.item .ih{display:flex;gap:10px;align-items:center}
.ico{width:38px;height:38px;border-radius:11px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:none}
.in{flex:1;min-width:0}
.in b{display:block;font-weight:600;font-size:15px}
.in small{color:var(--mut);font-size:12px}
.bar{height:6px;background:#0a0b0d;border-radius:9px;overflow:hidden;margin:11px 0 7px;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.st-soon .bar i{background:var(--soon)} .st-over .bar i{background:var(--over)} .st-verify .bar i{background:var(--ver)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.vn{margin:8px 0 0;font-size:12.5px;color:#b9c6ff;background:rgba(138,164,255,.07);border:1px solid rgba(138,164,255,.25);border-radius:10px;padding:7px 10px}
.acts{display:flex;gap:8px;margin-top:10px}
details.note summary{cursor:pointer;color:var(--mut);font-size:12.5px;margin-top:8px;list-style:none}
details.note summary::before{content:'ⓘ ';}
details.note p{margin:6px 0 0;font-size:12.5px;color:#c5c3bd}
.compact{padding:11px 12px}
.compact .ih .ico{width:34px;height:34px;font-size:17px}

/* rail (km view) */
.rail{position:relative;margin:0 6px 0 0;padding-right:22px}
.rail::before{content:'';position:absolute;right:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--rosso),var(--line) 25%,var(--line))}
.node{position:relative;margin-bottom:11px}
.node::before{content:'';position:absolute;right:-21px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--ok)}
.node.s-soon::before{border-color:var(--soon)} .node.s-over::before{border-color:var(--over)} .node.s-verify::before{border-color:var(--ver)}
.node.start::before{border-color:var(--rosso2);background:var(--rosso2)}
.mark{font-size:12px;color:var(--gold);margin:0 0 4px;font-weight:500;direction:rtl}
.est{color:var(--mut);font-size:11.5px}

/* year view */
.yr{font-size:30px;font-weight:700;color:var(--tx);margin:20px 4px 6px;display:flex;align-items:baseline;gap:10px}
.yr small{font-size:12px;color:var(--mut);font-weight:400}
.mo{font-size:11.5px;color:var(--gold);margin:0 2px 3px}

/* history */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:6px 13px;font-size:13px}
.fchip.on{background:var(--rosso);border-color:var(--rosso);color:#fff}
.hcard{padding:12px 13px}
.hcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hcard .top b{font-weight:600}
.hcard .d{color:var(--gold);font-size:12.5px;direction:rtl}
.hcard .k{color:var(--mut);font-size:12.5px}
.hcard ul{margin:7px 0 0;padding:0 18px 0 0;color:#cfcdc6;font-size:13px}
.hcard ul li{margin:1px 0}
.tag{font-size:11px;border-radius:7px;padding:1px 7px;background:var(--card2);border:1px solid var(--line);color:var(--mut);margin-inline-end:6px}
.tag.user{color:var(--gold);border-color:rgba(201,164,90,.4)}
.chart{direction:ltr}
.chart svg{width:100%;height:auto;display:block}

/* settings */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--mut)}
input,select,textarea{font-family:inherit;font-size:15px;background:#0d0e11;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input[type=number]{direction:ltr;text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rosso);outline-offset:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.set{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
details.set summary{padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.set .body{padding:0 13px 12px}
.chk{display:flex;gap:9px;align-items:center;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--rosso)}

/* nav */
nav{position:fixed;inset:auto 0 0 0;background:rgba(14,15,18,.93);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:5px 0;border-radius:10px}
nav button span{font-size:19px;line-height:1.1}
nav button.on{color:#fff}
nav button.on span{filter:drop-shadow(0 0 6px var(--rosso2))}
nav button.on::after{content:'';width:22px;height:3px;border-radius:3px;background:var(--rosso2);margin-top:2px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-body{position:relative;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet-body h3{margin:0 0 12px;font-size:17px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.foot{color:var(--mut);font-size:12px;margin:18px 6px;line-height:1.6}
.pulse{animation:pl 1.8s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(239,74,65,.0)}50%{box-shadow:0 0 0 5px rgba(239,74,65,.18)}}

.msgs{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.55;border:1px solid var(--line)}
.bub.u{align-self:flex-start;background:var(--rosso);border-color:var(--rosso);border-end-start-radius:4px;color:#fff}
.bub.b{align-self:flex-end;background:linear-gradient(180deg,var(--card),var(--bg2));border-end-end-radius:4px;border-color:#3a3322}
.bub b{color:var(--gold);font-weight:600}
.bub .li{display:block;color:#d7d4cd;font-size:13.5px}
.sugs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.askbar{position:sticky;bottom:78px;display:flex;gap:8px;background:rgba(12,13,16,.92);padding:8px 0;backdrop-filter:blur(8px)}
.askbar input{flex:1}
.bub img{display:block;max-width:190px;max-height:190px;border-radius:12px;margin-bottom:6px}
.askbar .btn.ic{padding:8px 11px;font-size:17px}
.rrow{display:grid;grid-template-columns:auto 1fr;gap:6px;margin-bottom:10px;padding:9px;border:1px solid var(--line);border-radius:12px;background:#101115}
.rrow .chk{grid-row:1}
.rrow select{grid-column:1/3}
.rrow .btn{grid-column:1/3;padding:5px}
.cost{color:var(--gold);font-size:12.5px}
.lg{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:#0b0c0f;border:1.5px solid currentColor}
.lg svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lg.r{color:#ff4a5c}.lg.a{color:#ffb020}
.lt{display:flex;gap:11px;align-items:center}.lt b{flex:1}
.ns li{margin:3px 0}.ns ul{margin:6px 0 0;padding-inline-start:18px;font-size:13.5px}
a.btn{display:inline-block;text-align:center;text-decoration:none}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px;margin:10px 0 4px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars i{display:block;background:linear-gradient(#ff4a5c,#8e0f1f);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
[data-del]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

  var dueDate=(it.lastDate&&it.intMonths)?addM(pd(it.lastDate),it.intMonths):null;
  var kmLeft=dueKm!=null?dueKm-S.odo:null;
  var dT=dueDate?dd(T,dueDate):null;
  var dK=kmLeft!=null?Math.round(kmLeft/rate):null;
  var out={it:it,dueKm:dueKm,dueDate:dueDate,kmLeft:kmLeft,dT:dT,dK:dK,status:'unknown',eff:null,bind:null,effKm:null,effDate:null,p:0};
  var c=[];if(dT!=null)c.push(['time',dT]);if(dK!=null)c.push(['km',dK]);
  if(!c.length)return out;
  c.sort(function(a,b){return a[1]-b[1];});
  out.bind=c[0][0];out.eff=c[0][1];
  var over=(kmLeft!=null&&kmLeft<0)||(dT!=null&&dT<0);
  var sk=it.soonKm==null?1500:it.soonKm, sd=it.soonDays==null?45:it.soonDays;
  var soon=(kmLeft!=null&&kmLeft<=sk)||(dT!=null&&dT<=sd);
  out.status=over?((it.verify&&!it.verified)?'verify':'over'):(soon?'soon':'ok');
  out.effDate=addD(T,out.eff);
  out.effKm=S.odo+Math.min(kmLeft!=null?kmLeft:Infinity,dT!=null?dT*rate:Infinity);
  var p=0;
  if(it.intKm&&it.lastKm!=null)p=Math.max(p,(S.odo-it.lastKm)/it.intKm);
  if(dueDate){var tot=dd(pd(it.lastDate),dueDate);if(tot>0)p=Math.max(p,dd(pd(it.lastDate),T)/tot);}

function chart(pts){
  var W=340,H=150,pl=34,pr=8,pt=10,pb=22;
  var t0=pd('2016-01-01'),t1=addM(today(),2);
  var xs=function(d){return pl+(d-t0)/(t1-t0)*(W-pl-pr);};
  var ymax=120000,ys=function(k){return H-pb-(k/ymax)*(H-pb-pt);};
  var g='';
  for(var k=0;k<=120000;k+=20000)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ys(k)+'" y2="'+ys(k)+'" stroke="#23252c"/><text x="'+(pl-4)+'" y="'+(ys(k)+3)+'" font-size="8" fill="#7d808a" text-anchor="end">'+(k/1000)+'k</text>';
  for(var y=2016;y<=today().getFullYear();y++){var x=xs(pd(y+'-01-01'));g+='<text x="'+x+'" y="'+(H-6)+'" font-size="8" fill="#7d808a" text-anchor="middle">'+y+'</text>';}
  var line=pts.map(function(p){return xs(p.d).toFixed(1)+','+ys(p.k).toFixed(1);}).join(' ');
  var dots=pts.map(function(p,i){return '<circle cx="'+xs(p.d).toFixed(1)+'" cy="'+ys(p.k).toFixed(1)+'" r="'+(i===pts.length-1?3.6:1.9)+'" fill="'+(i===pts.length-1?'#e23446':'#c9a45a')+'"/>';}).join('');
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'">'+g+'<polyline points="'+line+'" fill="none" stroke="#c9a45a" stroke-width="1.5"/>'+dots+'</svg></div>';
}

];
function norm(s){return String(s||'').toLowerCase().replace(/[״"'’׳]/g,'').replace(/\s+/g,' ').trim();}
function findGroup(q){
  q=norm(q);var best=null,bl=0;
  GROUPS.forEach(function(g){g.w.forEach(function(w){var n=norm(w);if(q.indexOf(n)>=0&&n.length>bl){bl=n.length;best=g;}});});
  return best;
}
function expand(q){var g=findGroup(q);return g?g.w.map(norm):[norm(q)];}
function entryText(x){return norm(x.t+' '+(x.i||[]).join(' '));}
function matches(x,terms){var t=entryText(x);return terms.some(function(w){return w&&t.indexOf(w)>=0;});}

{c:'drive',t:'תאורה: אורות יום, חיישן דמדומים ו-Follow me home',b:'אורות יום נדלקים כשהטבעת במצב DRL והמתנע ב-MAR. חיישן הדמדומים מדליק אורות צד וקצרים לבד, אבל אינו מזהה ערפל. מתקן גובה הפנסים בעל ארבעה מצבים (0–3) לפי העומס. פנס ערפל אחורי עובד רק עם אורות קצרים או ערפל קדמי. תאורת הכניסה נשארת כ-25 שניות אחרי פתיחה, ו-Follow me home מאיר 30 שניות לכל משיכת ידית, עד 210 שניות.',k:'אורות פנסים ערפל דמדומים follow me home תאורה גובה פנסים'},
{c:'drive',t:'מזגן ואוטומט – שימוש נכון',b:'MAX-DEF מפעיל מפוח מרבי וחום עם המדחס לפירוק אדים. החלון האחורי המחומם נכבה לבד אחרי כ-20 דקות. במזגן דו-אזורי טמפרטורת הייחוס 22 מעלות והלחצן AUTO מפעיל הכול אוטומטית. כשהמדחס כבוי אין ייבוש אוויר והחלונות עלולים להתכסות באדים. בחורף כדאי להפעיל את המזגן לפחות פעם בחודש כ-10 דקות.',k:'מזגן אוטומט פירוק אדים אדים חלון אחורי חימום'},
{c:'drive',t:'מפתח, התנעה, נעילה וילדים',b:'למתנע שלוש עמדות: STOP (אפשר להוציא מפתח והגה ננעל), MAR ו-AVV (התנעה). אם המנוע לא התניע, יש להחזיר ל-STOP לפני ניסיון נוסף. אם סוללת המפתח ריקה, מכניסים את המפתח ומסובבים ל-MAR כדי לכבות אזעקה. נעילה מרכזית פועלת מהמפתח או מהלחצן בלוח. נעילת ילדים בדלתות האחוריות מופעלת רק כשהדלת פתוחה, והדלת אינה נפתחת אז מבפנים. אחרי פגיעה, מערכת ניתוק הדלק פותחת את הדלתות.',k:'מפתח התנעה נעילה מרכזית ילדים דלת אחורית mar stop סוללה מפתח אזעקה'},
{c:'drive',t:'מושבים, הגה ומראות',b:'מושב חשמלי ניתן לכוונון כשהמתנע ב-MAR ועוד כדקה אחרי STOP (או כ-3 דקות אחרי פתיחת דלת). זיכרון נהג: שלושה מקומות, שומרים בהחזקת הלחצן עד צפצוף. חימום מושב בשלוש רמות. ההגה מתכוונן לגובה ולעומק כשהרכב עומד והמנוע כבוי. מראות הצד מתכווננות רק ב-MAR, ויש קיפול חשמלי. המראה הפנימית יכולה להחשיך לבד ומתיישרת בהילוך אחורי.',k:'מושב הגה מראה כוונון זיכרון חימום מושבים'},
{c:'drive',t:'מחשב דרך (Trip)',b:'שני זיכרונות עצמאיים, Trip A ו-Trip B. מציגים טווח, מרחק, צריכה ממוצעת ורגעית, מהירות ממוצעת וזמן נסיעה. לחיצה ארוכה על TRIP מאפסת. כשהטווח נמוך מ-50 ק״מ מוצגות קווים. הנתונים מתאפסים גם בניתוק מצבר.',k:'מחשב דרך trip צריכה טווח דלק'},
{c:'fluids',t:'תדלוק ופתח מילוי',b:'לכבות מנוע לפני תדלוק. בנזין ללא עופרת 95 אוקטן ומעלה (95 או 98). למילוי מלא אפשר להוסיף פעמיים אחרי הקליק הראשון של הנוזל. הפתח נפתח עם הנעילה המרכזית, והמכסה מחובר בחוט ונסגם בסיבוב עד קליק. בחירום יש חוט שחרור בצד ימין של תא המטען. לא נוסעים עם מיכל כמעט ריק, כי הפסקות באספקה עלולות לפגוע בקטליזטור.',k:'תדלוק דלק מיכל פתח מילוי 95 בנזין מכסה'},
{c:'drive',t:'מושבי ילדים וכרית נוסע',b:'ילדים חייבים להיות בהתקן מתאים, ומומלץ ישיבה אחורה כמה שיותר זמן, לפחות עד גיל 3–4. מעל 1.50 מ׳ משתמשים בחגורת מבוגר. כרית האוויר של הנוסע הקדמי מנוטרלת דרך תפריט ההגדרות ואחרי אישור, ונורית מאשרת שהיא כבויה. חובה לנטרל לפני התקנת מושב ילד הפוך בקדמי.',k:'ילד מושב בוסטר isofix כרית נוסע נטרול'},
{c:'drive',t:'חגורות ומותחני חגורה',b:'מכניסים את הלשון לאבזם עד קליק; לא משחררים בזמן נסיעה. מותחני החגורות הקדמיים פועלים פעם אחת ומוחלפים במוסך אחרי הפעלה. מעט עשן בהפעלה הוא תקין. אחרי תאונה חמורה מחליפים חגורות. ניקוי ידני במים וסבון עדין בלי להרטיב את המגלגל. כל חגורה לאדם אחד.',k:'חגורה חגורות מותח בטיחות'},
{c:'drive',t:'תקופת התרגלות (רודג׳)',b:'בתקופת השימוש הראשונה מומלץ להימנע מתאוצות חזקות, נסיעה ממושכת במהירות גבוהה ובלימות פתאומיות. הספר לא מציין מספר קילומטרים מדויק.',k:'רודג התרגלות רכב חדש'},
{c:'battery',t:'מצבר – ניתוק וחיבור',b:'לפני ניתוק או חיבור: מתנע ל-STOP, דלת נהג סגורה, והמתנים לפחות דקה. אין צורך להוסיף מים מזוקקים. מצבר שנשאר מתחת ל-50% טעינה זמן רב נפגע (סולפציה). טעינה איטית בזרם נמוך כ-24 שעות. החלפה מומלצת במוסך עם אותו מפרט, בגלל מערכת סטופ-סטארט.',k:'מצבר ניתוק חיבור טעינה חילוף בטרייה'},
{c:'specs',t:'נתוני מנוע וקיבולות',b:'מנוע 1.4 טורבו MultiAir (קוד 940A2000 בגרסת 170 כ״ס): נפח 1,368 סמ״ק, 170 כ״ס ב-5,500 סל״ד, מומנט 250 ננ״מ במצב דינמי או 230 בטבעי. יש גם גרסאות 163 ו-120 כ״ס. שמן מנוע: 3.5 ליטר עם החלפת מסנן (3.1 בלי). נוזל קירור 5.7 ליטר (חצי-חצי מים ו-PARAFLU UP). מיכל דלק 60 ליטר כולל רזרבה 8–10. מיכל שמשות 2.8 ליטר (4.6 עם שטיפת פנסים). נוזל בלמים 0.83 ליטר. תיבה ודיפרנציאל 2 ליטר.',k:'נפח מנוע שמן ליטר קיבולת מיכל קירור שמשות כוחות סוס הספק מומנט'},
{c:'specs',t:'ביצועים ומידות',b:'1.4 טורבו 170 כ״ס: מהירות מרבית 218 קמ״ש, 0–100 ב-7.8 שניות (7.7 ב-TCT). 163 כ״ס: אותם נתונים. 120 כ״ס: 195 קמ״ש ו-9.4 שניות. אורך 4,351 מ״מ. נפח תא מטען 350 ליטר.',k:'מהירות מרבית תאוצה אורך תא מטען נפח'},
{c:'tyres',t:'גלגל חלופי קטן – מגבלות',b:'הגלגל החלופי הקטן (T135/70 R16, או T125/80 R17) מנופח ל-4.2 בר, ומותר לנסוע איתו עד 80 קמ״ש ובערך עד 3,000 ק״מ. להחליף בהקדם לצמיג רגיל.',k:'גלגל חלופי קטן פלאצק רזרבה ספייר'},
{c:'tyres',t:'מתי להחליף צמיגים',b:'מחליפים ב-1.6 מ״מ עומק סוליה. בדיקת לחץ אחת לשבועיים ולפני נסיעה ארוכה. לחץ בצמיג חם גבוה בכ-0.3 בר; לצמיגי שלג מוסיפים 0.2 בר. צמיגים בני יותר מ-6 שנים כדאי לבדוק אצל מומחה, גם אם הסוליה טובה.',k:'צמיגים החלפה גיל סוליה עומק לחץ'},
{c:'lights',t:'🔴 נוזל בלמים נמוך / בלם יד',b:'נוזל בלמים נמוך: להשלים ולוודא שהנורית כבתה. בלם יד פעיל: לשחרר. אם הנורית נשארת – למוסך.',k:'נורה אדומה בלם יד נוזל בלמים'},
{c:'lights',t:'🔴🟡 תקלת EBD (אדום וכתום יחד)',b:'הגלגלים האחוריים עלולים להינעל בבלימה חזקה. לנסוע בזהירות למוסך לבדיקה מיידית.',k:'ebd בלימה נורה'},
{c:'lights',t:'🔴 תקלת כריות אוויר',b:'אמורה לכבות כמה שניות אחרי ההתנעה. אם נשארת דולקת – מערכת כריות האוויר תקולה; למוסך מיד.',k:'כרית אוויר airbag'},
{c:'lights',t:'🔴 חגורות בטיחות לא חגורות',b:'קבועה בעמידה כשחגורת הנהג פתוחה. מהבהבת עם זמזם בנסיעה – חגורות קדמיות לא חגורות. לחגור.',k:'חגורה בטיחות'},
{c:'lights',t:'🔴 תקלת מטען (אלטרנטור / מצבר)',b:'אמורה לכבות כשהמנוע פועל. אם נשארת או מהבהבת – למוסך בהקדם. בינתיים לכבות צרכנים מיותרים.',k:'מצבר אלטרנטור טעינה נורה'},
{c:'lights',t:'🔴 לחץ שמן מנוע נמוך',b:'אם נדלקת בנסיעה – לעצור מיד, לכבות מנוע ולפנות למוסך (לא להמשיך לנסוע).',k:'שמן לחץ שמן נורה'},
{c:'lights',t:'🔴 שמן מנוע מבותה (מהבהבת)',b:'השמן התבלה מהשימוש – זו לא תקלה ולא מפלס נמוך. להחליף שמן בהקדם ולכל היותר תוך 500 ק״מ מההופעה הראשונה. לא להוסיף שמן.',k:'שמן החלפה נורה מהבהבת'},
{c:'lights',t:'🔴 טמפרטורת מנוע גבוהה',b:'לעצור, לכבות ולחכות שיתקרר, ואז לבדוק מפלס נוזל קירור ולהשלים אם חסר. אם חוזר – למוסך. אחרי נהיגה תובענית כדאי לעמוד רגע לפני כיבוי.',k:'התחממות חום קירור נורה'},
{c:'lights',t:'🔴 תקלת תיבת TCT',b:'מהבהבת עם הודעה וזמזם = תקלה בתיבה. יכולה להופיע גם מהתחממות אחרי עומס, ואז ההספק מוגבל. למוסך בהקדם.',k:'tct תיבה נורה'},
{c:'lights',t:'🔴 דלת / תא מטען לא סגורים',b:'דלת, תא מטען (או מכסה מנוע) לא נעולים עד הסוף. לסגור. אם הרכב נע עם דלת פתוחה יישמע זמזם.',k:'דלת פתוחה'},
{c:'lights',t:'🔴 חריגת מהירות',b:'מופיעה כשעוברים את המהירות שהוגדרה בתפריט ההגדרות. להאט.',k:'מהירות'},
{c:'lights',t:'🔴 תקלת הגה פעיל (Dual pinion)',b:'עזרת ההגה עלולה להיעלם: ההגה כבד יותר אך עדיין אפשרי. למוסך בהקדם.',k:'הגה היגוי נורה'},
{c:'lights',t:'🟡 CODE / אזעקה',b:'קבועה = תקלה במערכת. מהבהבת = ניסיון פריצה. למוסך בהקדם. אם הרכב לא מתניע: מפתח ל-STOP ואז MAR, או נסה מפתח אחר.',k:'code אזעקה immobilizer'},
{c:'lights',t:'🟡 רזרבת דלק',b:'נדלקת כשנשארו כ-8–10 ליטר. לתדלק. מתחת לכ-50 ק״מ טווח יכולה להופיע הודעה.',k:'דלק רזרבה'},
{c:'lights',t:'🟡 תקלה כללית (קבוצה 1)',b:'כוללת ניתוק דלק, Start&Stop, חיישן גשם וחיישני חניה. למוסך.',k:'תקלה כללית'},
{c:'lights',t:'🟡 תקלה כללית (קבוצה 2)',b:'כוללת חיישן דמדומים, חיישן לחץ שמן, פנסים אדפטיביים (AFS) והגנת צביטה בחלון. למוסך.',k:'תקלה כללית'},
{c:'lights',t:'🟡 תקלת תאורה חיצונית',b:'לבדוק נתיכים ונורות של האור הרלוונטי (DRL, אורות צד, איתות, ערפל אחורי, לוחית). אם נשארת – למוסך.',k:'נורה פנס תאורה'},
{c:'lights',t:'🟡 תקלת ABS',b:'בלימה רגילה נשארת אבל בלי ABS. לנהוג בזהירות ולפנות למוסך.',k:'abs בלמים'},
{c:'lights',t:'🟡 שחיקת רפידות בלם',b:'רפידות קדמיות ואחוריות שחוקות. להחליף בקרוב.',k:'רפידות בלמים ברקסים'},
{c:'lights',t:'🟡 כרית אוויר נוסע כבויה',b:'מידע בלבד: כרית הנוסע הקדמי כבויה. אם מהבהבת – הנורית עצמה תקולה, למוסך.',k:'כרית אוויר נוסע'},
{c:'lights',t:'🟡 תקלת הזרקה / EOBD (מנוע)',b:'קבועה: תקלת הזרקה או הצתה. להימנע ממאמץ ולפנות למוסך. מהבהבת (בנזין): סכנה לקטליזטור – להקל על הגז עד שתפסיק להבהב ולנסוע בעדינות למוסך.',k:'מנוע check engine הזרקה eobd נורה'},
{c:'lights',t:'🟡 לחץ אוויר בצמיגים (iTPMS)',b:'קבועה: צמיג אחד או יותר חלש. לא להמשיך לנסוע – לעצור בבטחה ולתקן (ערכת Fix&Go) ואז למוסך. מהבהבת כ-75 שניות ואז קבועה: המערכת כבויה או תקולה. לאפס כשאפשר.',k:'צמיגים לחץ נורה פנצר'},
{c:'maint',t:'לוח הטיפולים התקופתיים (בנזין)',b:'הטיפולים חוזרים בצעדים של 15,000 ק״מ או שנה (המוקדם). בכל טיפול בודקים מצב ולחץ צמיגים, תאורה, מפלסי נוזלים, פליטה, שקע האבחון ורפידות בלם קדמיות. אחרי 120,000 ק״מ או 8 שנים התוכנית חוזרת מהצעד הראשון.',k:'טיפול תקופתי מרווח 15000 שנה'},
{c:'maint',t:'שמן מנוע ומסנן שמן – מתי להחליף',b:'מוחלפים בנקודות הטיפול המתוכננות, ופעם בשנה אם הנסיעה בעיקר עירונית או מתחת ל-10,000 ק״מ בשנה. נורית שמן אדומה מהבהבת פירושה שהשמן התבלה (לא שהמפלס נמוך): לא מוסיפים שמן, מחליפים בהקדם ולכל היותר תוך 500 ק״מ.',k:'שמן פילטר שמן נורית'},
{c:'maint',t:'מצתים',b:'מוחלפים בנקודות הטיפול המתוכננות, כולם מאותו סוג. בגרסת 1.4 טורבו מצוין מצת NGK IKR9J8.',k:'מצת מצתים ngk'},
{c:'maint',t:'נוזל בלמים, מסנן אוויר ומסנן מזגן',b:'נוזל הבלמים ומסנן האוויר מוחלפים בנקודות הטיפול המתוכננות. באזורים מאובקים מחליפים מסנן אוויר כל 15,000 ק״מ. מסנן תא הנוסעים (מזגן): בספר מומלץ בכל טיפול שני; בפועל נהוג להחליף אחת לשנה.',k:'נוזל בלמים מסנן אוויר מסנן מזגן פולן'},
{c:'maint',t:'רצועת תזמון ורצועת עזר',b:'מוחלפות כל 6 שנים או 120,000 ק״מ (סביבה לא מאובקת). בשימוש קשה או באזור מאובק: כל 4 שנים או 60,000 ק״מ. המנוע מסוג interference – קריעת רצועה גורמת לנזק חמור.',k:'טיימינג תזמון רצועה'},
{c:'maint',t:'רפידות בלם',b:'רפידות הבלם הקדמיות נבדקות בכל טיפול. נורית כתומה של שחיקת רפידות מחייבת בדיקה בהקדם.',k:'בלמים ברקסים רפידות דיסקים'},
{c:'maint',t:'מגבים',b:'הספר מפנה להחלפת להבי המגבים בפרק התחזוקה ואינו קובע מרווח קבוע. ההמלצה המקובלת: להחליף אחת לשנה, או כשיש רעידות, פסים או רעש.',k:'מגב מגבים להב'},

function md(t){
  var s=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'),o='';
  s.split('\n').forEach(function(l){
    var m=l.match(/^\s*(?:[-•]|\*)\s+(.*)/);

    else if(/^\s*#+\s*/.test(l))o+='<b>'+l.replace(/^\s*#+\s*/,'')+'</b><br>';

async function netFetch(url,opts){

      catch(ne){lastErr=new Error('אין חיבור יציב לאינטרנט. בדוק Wi-Fi או נתונים סלולריים ונסה שוב');if(at===1)break;await sleep(1200);continue;}
      if(r.ok){
        var j=await r.json(),c=j.candidates&&j.candidates[0];
        var t=c&&c.content&&c.content.parts?c.content.parts.map(function(p){return p.text||'';}).join(''):'';
        if(t)return t;
        lastErr=new Error('תשובה ריקה מ-Gemini');break;
      }
      var tx='';try{tx=await r.text();}catch(e){}
      if(r.status===400&&/API key|API_KEY/i.test(tx))throw new Error('מפתח Gemini לא תקין');
      if(r.status===401||r.status===403)throw new Error('מפתח Gemini נדחה ('+r.status+')');
      lastErr=new Error(r.status===503||r.status===429||r.status>=500?'Gemini עמוס כרגע, נסה שוב בעוד רגע':'שגיאת Gemini '+r.status+' '+tx.slice(0,100));
      if(r.status===503||r.status===429||r.status>=500){if(at===1)break;stage('Gemini עמוס, מנסה שוב…');await sleep(1500);continue;}
      break;

function drawScaled(src,w,h){
  return new Promise(function(res,rej){
    var sc=Math.min(1,1400/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);
    var url=c.toDataURL('image/jpeg',0.8);
    if(!url||url.length<100){rej(new Error('המרת תמונה נכשלה'));return;}
    c.toBlob(function(b){res({url:url,b64:url.split(',')[1],mime:'image/jpeg',blob:b});},'image/jpeg',0.8);
  });
}

  if(!isHeic){
    try{var u=URL.createObjectURL(file);try{var im=await withTimeout(loadImg(u),12000,'load');return await withTimeout(drawScaled(im,im.naturalWidth||im.width,im.naturalHeight||im.height),8000,'draw');}finally{URL.revokeObjectURL(u);}}catch(e){}

var _idb=null;
function idbOpen(){
  if(_idb)return _idb;
  _idb=new Promise(function(res,rej){
    try{
      var q=indexedDB.open('giulietta-files',1);
      q.onupgradeneeded=function(){q.result.createObjectStore('f');};
      q.onsuccess=function(){res(q.result);};
      q.onerror=function(){rej(q.error);};
    }catch(e){rej(e);}
  });
  return _idb;
}
function imgPut(url){
  if(!url)return Promise.resolve(url);
  if(String(url).indexOf('idb:')===0)return Promise.resolve(url);
  var id='idb:'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  return idbOpen().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction('f','readwrite');tx.objectStore('f').put(url,id);
    tx.oncomplete=function(){res(id);};tx.onerror=function(){rej(tx.error);};tx.onabort=function(){rej(tx.error);};
  });}).catch(function(){return url;});
}
function imgGet(ref){
  if(!ref||String(ref).indexOf('idb:')!==0)return Promise.resolve(ref||null);
  return idbOpen().then(function(db){return new Promise(function(res){
    var q=db.transaction('f','readonly').objectStore('f').get(ref);
    q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};
  });}).catch(function(){return null;});
}
function imgDel(ref){
  if(!ref||String(ref).indexOf('idb:')!==0)return;
  idbOpen().then(function(db){db.transaction('f','readwrite').objectStore('f').delete(ref);}).catch(function(){});
}

function insDash(ps){
  if(!ps.length)return '';
  var pr=ps.filter(function(p){return p.premium;}),tot=0;pr.forEach(function(p){tot+=p.premium;});
  var asc=pr.slice().reverse(),last=asc[asc.length-1],prev=asc[asc.length-2];
  var chg=last&&prev?Math.round((last.premium-prev.premium)/prev.premium*100):null;
  var t=function(l,v,sub){return '<div class="card compact" style="flex:1;min-width:46%;margin:0"><div class="mut" style="font-size:12px">'+l+'</div><div style="font-size:20px;font-weight:700;margin-top:2px">'+v+'</div>'+(sub?'<div class="mut" style="font-size:11.5px">'+sub+'</div>':'')+'</div>';};
  var o='<h2>דשבורד ביטוח</h2><div style="display:flex;flex-wrap:wrap;gap:8px">'+
    t('פרמיה אחרונה',last?'₪'+fmtN(last.premium):'-',last?esc(polYear(last)):'')+
    t('סה״כ שולם',pr.length?'₪'+fmtN(tot):'-',pr.length+' שנים עם מחיר')+
    t('ממוצע לשנה',pr.length?'₪'+fmtN(Math.round(tot/pr.length)):'-','')+
    t('שינוי משנה קודמת',chg==null?'-':(chg>0?'▲ ':chg<0?'▼ ':'')+Math.abs(chg)+'%',prev?'מ-₪'+fmtN(prev.premium):'')+'</div>';
  if(asc.length>1){var mx=Math.max.apply(null,asc.map(function(p){return p.premium;}));o+='<div class="card"><div class="bars" style="height:110px">'+asc.map(function(p){return '<div><span style="font-size:10.5px;color:var(--gold)">'+fmtN(p.premium)+'</span><i style="height:'+Math.round(p.premium/mx*70)+'px"></i>'+esc(polYear(p).slice(0,4))+'</div>';}).join('')+'</div></div>';}
  o+='<h2>פוליסות לפי שנה</h2><div class="card" style="padding:6px 10px"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr class="mut" style="font-size:11.5px"><td>שנה</td><td>חברה / סוג</td><td>פרמיה</td><td>שינוי</td><td></td></tr>';
  var by=ps.slice().reverse();
  by.forEach(function(p,i){
    var pv=null;for(var k=i-1;k>=0;k--){if(by[k].premium){pv=by[k];break;}}
    var c=p.premium&&pv?Math.round((p.premium-pv.premium)/pv.premium*100):null;
    o+='<tr data-del="pol:'+p.id+'" style="border-top:1px solid var(--line)"><td style="padding:8px 0"><b>'+esc(polYear(p))+'</b></td><td>'+esc(p.insurer||'-')+(p.type?'<div class="mut" style="font-size:11.5px">'+esc(p.type)+'</div>':'')+'</td><td><b>'+(p.premium?'₪'+fmtN(p.premium):'-')+'</b></td><td style="color:'+(c>0?'#ff6b6b':c<0?'#5fd38d':'inherit')+'">'+(c==null?'':(c>0?'▲':'▼')+Math.abs(c)+'%')+'</td><td style="text-align:left">'+(p.cov&&p.cov.length?'<button class="btn" data-a="covview" data-id="'+p.id+'" aria-label="פירוט הכיסויים">📋</button> ':'')+(p.img?'<button class="btn" data-a="dview" data-k="p:'+p.id+'" aria-label="הצג טופס">👁</button> ':'')+'<button class="btn" data-a="pedit" data-id="'+p.id+'" aria-label="עריכה">✏️</button></td></tr>';
  });
  return o+'</table></div>';
}

function mergeContacts(list,keep){
  (list||[]).forEach(function(c){
    if(!c.on||!c.phone)return;
    var t=c.key?D.contacts.filter(function(x){return x.id===c.key;})[0]:null;
    if(t){if(!keep||!t.phone)t.phone=c.phone;if(c.name&&(!keep||!t.name))t.name=c.name;}
    else if(!D.contacts.some(function(x){return telNum(x.phone)===telNum(c.phone);}))D.contacts.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,5),role:c.role||c.name||'אחר',name:c.name||'',phone:c.phone});
  });
}
function commitPol(f,imgUrl){
  var p=D.pols.filter(function(x){return x.end===f.end&&((x.insurer||'')===(f.insurer||'')||(f.policyNo&&x.policyNo===f.policyNo));})[0],isNew=!p;
  if(!p){p={id:'p'+Date.now()+Math.random().toString(36).slice(2,5)};D.pols.push(p);}
  p.insurer=f.insurer;p.type=f.type;p.policyNo=f.policyNo;p.start=f.start;p.end=f.end;p.premium=num(f.premium)||p.premium||null;if(imgUrl){(function(pp){imgPut(imgUrl).then(function(r){pp.img=r;dsave();});})(p);}
  mergeContacts(f.contacts,true);
  var ci=D.contacts.filter(function(x){return x.id==='c_ins';})[0];if(ci&&!ci.name&&f.insurer)ci.name=f.insurer;
  return {p:p,isNew:isNew};
}
async function scanIns(files){
  var added=[],fail=[],review=null,total=files.length,failedFiles=[],tk=++scanTok;
  openSheet(progSheet('📷 קורא '+(total>1?total+' טפסים':'את הטופס')+'…'));
  for(let i=0;i<total;i++){
    if(tk!==scanTok)return;
    stage('טופס '+(i+1)+' / '+total+': מכין את התמונה…');
    try{
      var img=await fileToImg(files[i]);
      if(tk!==scanTok)return;
      stage('טופס '+(i+1)+' / '+total+': שולח לבינה מלאכותית… (עד חצי דקה)');
      imgPut(img.url).then(function(r){D.imgs.insurance=r;dsave();});
      var t=await llmRaw(INS_SYS,'תאריך היום: '+iso(today())+'. החזר את ה-JSON.',img,true);
      if(tk!==scanTok)return;
      var f=insFromJson(parseJson(t));
      if(f.end)added.push(commitPol(f,img.url));
      else{fail.push('טופס '+(i+1)+': לא זוהה תאריך סיום');if(!review)review={f:f,img:img.url};}
    }catch(e){
      if(e&&e.nokey){var rest=files.slice(i);needKey(function(){scanIns(rest);},function(){df=blankIns();polSheet('מילוי ידני של פרטי הפוליסה.');});if(added.length)dsave();return;}
      fail.push('טופס '+(i+1)+': '+((e&&e.message)?String(e.message).slice(0,90):'שגיאה'));failedFiles.push(files[i]);
    }
  }
  if(!dsave()){D.pols.forEach(function(p){if(p.img&&String(p.img).indexOf('data:')===0)delete p.img;});if(D.imgs.insurance&&String(D.imgs.insurance).indexOf('data:')===0)D.imgs.insurance=null;dsave();}
  render();
  var s='<h3>'+(added.length?'✅ נקראו '+added.length+' פוליסות':'⚠ לא נקרא מידע')+'</h3>';
  added.forEach(function(r){var p=r.p;s+='<div class="card compact"><b>'+esc(polYear(p))+(p.insurer?' · '+esc(p.insurer):'')+'</b><div class="mut" style="font-size:12.5px">'+(p.type?esc(p.type)+' · ':'')+'עד '+esc(fmtD(pd(p.end)))+' · '+(p.premium?'₪'+fmtN(p.premium):'פרמיה לא זוהתה')+(r.isNew?'':' · עודכן')+'</div></div>';});
  if(fail.length)s+='<p class="mut" style="font-size:12.5px">'+fail.map(esc).join('<br>')+'</p>';
  s+='<p class="mut" style="font-size:12.5px">הכול סודר לפי שנים בדשבורד. אפשר לתקן כל פוליסה בלחיצה על ✏️, ולמחוק בלחיצה ארוכה.</p><div class="row">'+(failedFiles.length?'<button class="btn" data-a="pretry">🔄 נסה שוב</button><button class="btn" data-a="tconn">🔍 בדיקת חיבור</button>':'')+(review?'<button class="btn" data-a="preview">השלם טופס שלא נקרא</button>':'')+'<button class="btn red grow" data-a="closeSheet">סגור</button></div>';
  window._rev=review;window._failedFiles=failedFiles;
  openSheet(s);
}
function safeJson(x){
  try{return JSON.parse(x);}catch(e1){}
  var y=String(x).replace(/[\u0000-\u001f]/g,' ').replace(/\\(?!["\\\/bfnrt]|u[0-9a-fA-F]{4})/g,'').replace(/,\s*([}\]])/g,'$1');
  try{return JSON.parse(y);}catch(e2){}
  y=y.replace(/\\u[0-9a-fA-F]{4}/g,'');
  return JSON.parse(y);
}

var SPEC_SYS='אתה מחלץ נתונים ממפרט / דף פוליסה של ביטוח רכב בעברית (ישראל). החזר JSON בלבד, בלי טקסט נוסף ובלי גדרות קוד:\n{"insurer":"","policyNo":"","start":"YYYY-MM-DD","end":"YYYY-MM-DD","total":העלות הכוללת לתשלום עבור כל תקופת הביטוח כמספר או null,"coverages":[{"name":"שם הכיסוי","limit":"גובה הכיסוי / גבול האחריות כפי שמופיע","deductible":"גובה ההשתתפות העצמית כפי שמופיע","note":"הערה קצרה או תנאי, אם יש"}]}\nכללים: רשום כל כיסוי והרחבה שמופיעים במפרט (למשל נזקי גוף, נזק לרכוש צד ג׳, ביטוח מקיף, גניבה, שמשות, גרירה, רכב חלופי, שירותי דרך, הרחבות). limit ו-deductible כטקסט כפי שמופיעים, כולל יחידות (₪, %, ללא הגבלה). total = סה״כ פרמיה / סה״כ לתשלום, בלי סימנים. תאריכים בישראל הם DD/MM/YYYY. אל תמציא נתון שלא מופיע: השמט או null.';
function specPol(j){

  if(!p&&!end)p=curPol();

function mergeCov(p,list){

function parseRecords(t){
  var s=String(t),i=s.indexOf('{');if(i<0)throw new Error('לא התקבל JSON תקין');s=s.slice(i);
  try{var m=s.match(/\{[\s\S]*\}/);return safeJson(m[0]).records||[];}
  catch(e){var k=s.lastIndexOf('},');if(k<0)throw new Error('לא התקבל JSON תקין');return safeJson(s.slice(0,k+1)+']}').records||[];}

function applyRecord(r){
  var d=okDate(r.date);if(!d)return {skip:'ללא תאריך תקין'};
  var kn=numClean(r.km),km=kn===''?null:Number(kn),est=km==null;
  var dup=histAll().some(function(x){return x.d===d&&(x.km==null||km==null||Math.abs(x.km-km)<=300);});
  if(dup)return {skip:'קיים כבר',d:d};
  var days=dd(pd(d),today()),kmFinal=km!=null?km:Math.max(0,Math.round(S.odo-S.rate*Math.max(0,days)));
  var done=[],lines=(r.lines||[]).filter(function(l){return l&&l.desc;});

    var st=S.items[id];if(!st)return;

/* ---------- start-up rev animation ---------- */
function revUp(){
  var nd=document.getElementById('ndl');
  if(!nd||tab!=='dash')return;
  var fin=Number(nd.getAttribute('data-fin')),A0=135,AM=135+270*0.93,DUR=3000;
  var els=[],rings=[];
  Array.prototype.forEach.call(document.querySelectorAll('#view .num,#view .big,#view .ring text:first-of-type,#odoT'),function(el){
    var tn=null;for(var i=0;i<el.childNodes.length;i++){if(el.childNodes[i].nodeType===3&&/\d/.test(el.childNodes[i].nodeValue)){tn=el.childNodes[i];break;}}
    if(!tn)return;
    var m=/^(\s*~?)([\d,]+)(.*)$/.exec(tn.nodeValue);if(!m)return;
    var fv=Number(m[2].replace(/,/g,''));if(!isFinite(fv)||fv<=0)return;
    els.push({tn:tn,el:el,pre:m[1],post:m[3],fv:fv,comma:m[2].indexOf(',')>=0});
  });
  Array.prototype.forEach.call(document.querySelectorAll('#view .ring circle:nth-of-type(2)'),function(c){
    var d=(c.getAttribute('stroke-dasharray')||'').split(' ');rings.push({c:c,a:Number(d[0]),b:d[1]});
  });
  function eo(u){u=Math.min(1,Math.max(0,u));return 1-Math.pow(1-u,3);}
  function eio(u){u=Math.min(1,Math.max(0,u));return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;}
  var t0=null,done=false;
  function frame(ts){
    if(done)return;
    if(t0===null)t0=ts;
    var t=ts-t0,ang;
    if(!document.getElementById('ndl')||document.getElementById('ndl')!==nd){done=true;return;}
    if(t<1100)ang=A0+(AM-A0)*eo(t/1100);
    else if(t<1550)ang=AM+Math.sin((t-1100)/45)*2.2;
    else ang=AM+(fin-AM)*eio((t-1550)/1450);
    nd.setAttribute('transform','rotate('+(ang-fin).toFixed(2)+' 110 102)');
    var k=eo(t/2400);
    els.forEach(function(o){
      var v=Math.round(o.fv*k);
      o.tn.nodeValue=o.pre+(o.comma?v.toLocaleString('en-US'):String(v))+o.post;
    });
    rings.forEach(function(r){r.c.setAttribute('stroke-dasharray',(r.a*k).toFixed(1)+' '+r.b);});
    if(t<DUR)requestAnimationFrame(frame);
    else{done=true;unlock();nd.removeAttribute('transform');els.forEach(function(o){o.tn.nodeValue=o.pre+(o.comma?o.fv.toLocaleString('en-US'):String(o.fv))+o.post;});rings.forEach(function(r){r.c.setAttribute('stroke-dasharray',r.a+' '+r.b);});}
  }
  /* lock layout so nothing moves while the digits change */
  var locked=[];
  Array.prototype.forEach.call(document.querySelectorAll('#view .card'),function(c){locked.push({c:c,h:c.style.minHeight});c.style.minHeight=c.getBoundingClientRect().height+'px';});
  els.forEach(function(o){
    if(!o.el||o.el.namespaceURI==='http://www.w3.org/2000/svg')return;
    var w=o.el.getBoundingClientRect().width;
    o.sv={d:o.el.style.display,w:o.el.style.minWidth,f:o.el.style.fontVariantNumeric,t:o.el.style.textAlign};
    o.el.style.fontVariantNumeric='tabular-nums';
    var cs=getComputedStyle(o.el);
    if(cs.display==='inline')o.el.style.display='inline-block';
    o.el.style.minWidth=w+'px';
  });
  function unlock(){
    locked.forEach(function(l){l.c.style.minHeight=l.h;});
    els.forEach(function(o){if(o.sv){o.el.style.display=o.sv.d;o.el.style.minWidth=o.sv.w;o.el.style.fontVariantNumeric=o.sv.f;}});
  }
  nd.setAttribute('transform','rotate('+(A0-fin)+' 110 102)');
  els.forEach(function(o){o.tn.nodeValue=o.pre+'0'+o.post;});
  rings.forEach(function(r){r.c.setAttribute('stroke-dasharray','0 '+r.b);});
  requestAnimationFrame(frame);
}

  if(el.id==='d_spec'){var spf=el.files?Array.prototype.slice.call(el.files):[];el.value='';if(spf.length)scanSpec(spf);return;}
  var dm=/^d_(ins|lic)_/.exec(el.id||'');
  if(dm){var dfs=el.files?Array.prototype.slice.call(el.files):[];el.value='';if(dfs.length){if(dm[1]==='ins')scanIns(dfs);else scanDoc('lic',dfs[0]);}return;}
  if(el.getAttribute('data-d')!=null||el.getAttribute('data-dc')!=null){dfUpdate(el);return;}
  if(el.id==='r_cam'||el.id==='r_gal'){var rf=el.files&&el.files[0];el.value='';if(rf)openReceipt(rf);return;}
  if(el.getAttribute('data-r')){rcpUpdate(el);return;}
  if(el.id==='b_cam'||el.id==='b_gal'){var f=el.files&&el.files[0];el.value='';pickImage(f);return;}
  if(el.id==='h_y'){hy=el.value;var hl2=document.getElementById('hlist');if(hl2)hl2.innerHTML=histList();return;}
  if(el.getAttribute('data-f')){
    var id=el.getAttribute('data-id'),k=el.getAttribute('data-k'),st=S.items[id];
    st[k]=(k==='lastDate')?(el.value||null):num(el.value);
    if(k==='lastDate'||k==='lastKm'){st.est=false;st.verified=true;}
    save();toast('נשמר ✓');return;
  }
  var m={f_odo:function(){var v=num(el.value);if(v>0){S.odo=v;}},f_odod:function(){if(el.value)S.odoDate=el.value;},f_rate:function(){var v=num(el.value);if(v>0)S.rate=v/365;},
         f_test:function(){if(el.value)S.test.due=el.value;},f_key:function(){S.apiKey=el.value.trim();},f_prov:function(){S.provider=el.value;},f_gkey:function(){S.gkey=el.value.trim();},f_gmodel:function(){S.gmodel=el.value.trim();},f_model:function(){S.model=el.value;},f_web:function(){S.web=el.checked;},f_paid:function(){S.test.paid=el.checked;}};
  if(m[el.id]){m[el.id]();save();toast('נשמר ✓');}
});

render();
setTimeout(function(){try{revUp();}catch(e){}},2950);
})();
</script>
