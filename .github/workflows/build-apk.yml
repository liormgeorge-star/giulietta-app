name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          grep -n "CAMERA\|uses-feature" "$M"
          bash scripts/icons.sh

      - name: Use fixed signing key (so updates install over the old app and keep data)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          cat >> android/app/build.gradle <<'EOF'

android {
    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/../signing/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}
EOF

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Print signer fingerprint
        run: |
          FP=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//')
          echo "SIGNER_FP=$FP" >> "$GITHUB_ENV"
          echo "Signer SHA256: $FP"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: giulietta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk giulietta.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest giulietta.apk --title "Giulietta APK (latest)" --notes "Auto-built from commit ${GITHUB_SHA::7} | signer ${SIGNER_FP}" --target "$GITHUB_SHA"
