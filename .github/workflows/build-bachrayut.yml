name: Build באחריות APK

on:
  push:
    branches: [main, claude/warranty-management-app-dxjce7]
    paths: ['bachrayut/**', '.github/workflows/build-bachrayut.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bachrayut
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and bundle OCR and Firebase
        run: |
          npm install
          bash scripts/vendor.sh

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          pip install --quiet --break-system-packages pillow 2>/dev/null || pip install --quiet pillow
          python3 scripts/make_icons.py android/app/src/main/res

      - name: Use the fixed signing key (updates install over the old app and keep data)
        run: |
          mkdir -p ~/.android
          cp ../signing/debug.keystore ~/.android/debug.keystore
          mkdir -p signing && cp ../signing/debug.keystore signing/
          cat ../signing/signing.gradle >> android/app/build.gradle

      - name: Build debug APK
        working-directory: bachrayut/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bachrayut-apk
          path: bachrayut/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bachrayut.apk
          gh release delete bachrayut-latest --yes --cleanup-tag || true
          gh release create bachrayut-latest bachrayut.apk --title "באחריות APK (latest)" --notes "Auto-built from commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
