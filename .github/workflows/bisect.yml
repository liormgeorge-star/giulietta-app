name: Bisect test APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: t10, sha: 0117eea }
          - { name: t13, sha: 8ace949 }
          - { name: t14, sha: a41a5a1 }
          - { name: t15, sha: a737ad7 }
          - { name: t16, sha: f7ab19e }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Pick the page version and a separate app id
        run: |
          git show ${{ matrix.sha }}:www/index.html > www/index.html
          sed -i 's#"appId": "com.liorg.giulietta"#"appId": "com.liorg.giulietta.${{ matrix.name }}"#; s#"appName": ".*"#"appName": "G ${{ matrix.name }}"#' capacitor.config.json
          cat capacitor.config.json | head -4
      - run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          bash scripts/icons.sh
      - name: Signing
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          cat signing/signing.gradle >> android/app/build.gradle
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for d in apks/*; do n=$(basename "$d"); cp "$d/app-debug.apk" "$n.apk"; done
          ls -la *.apk
          gh release delete bisect --yes --cleanup-tag || true
          gh release create bisect *.apk --title "Test builds" --notes "Side-by-side test builds" --target "$GITHUB_SHA"
